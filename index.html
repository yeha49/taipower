  /* -----------------------------------------------------------
     絕對網址 / Google Docs / Google Drive 支援
     ----------------------------------------------------------- */
  function isAbsoluteUrl(s) {
    if (!s) return false;
    return /^[a-z][a-z0-9+.-]*:\/\//i.test(s) || /^\/\//.test(s);
  }

  function shortUrlLabel(url) {
    let s = String(url || '').trim();
    s = s.replace(/^[a-z][a-z0-9+.-]*:\/\//i, '').replace(/^www\./i, '');
    if (s.length > 56) s = s.slice(0, 53) + '…';
    return s || String(url || '');
  }

  function googlePreviewUrl(url) {
    let m;
    m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/i);
    if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';

    m = url.match(/drive\.google\.com\/open\?(?:[^#]*?&)?id=([\w-]+)/i);
    if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';

    m = url.match(/docs\.google\.com\/(document|presentation|spreadsheets|drawings|forms)\/d\/([\w-]+)/i);
    if (m) return 'https://docs.google.com/' + m[1] + '/d/' + m[2] + '/preview';

    return null;
  }

  function makeExternalItem(url) {
    const label   = shortUrlLabel(url);
    const preview = googlePreviewUrl(url);

    if (preview) {
      return {
        num: url, type: 'pdf', src: preview, filename: label,
        _external: true, _original: url, el: null
      };
    }

    let ext = '';
    try {
      const u = new URL(url, location.href);
      const m = u.pathname.match(/\.([A-Za-z0-9]+)$/);
      if (m) ext = m[1].toLowerCase();
    } catch (_) {
      const m = String(url).match(/\.([A-Za-z0-9]+)(?:[?#]|$)/);
      if (m) ext = m[1].toLowerCase();
    }

    if (VIDEO_EXTS_SET.has(ext)) {
      return {
        num: url, type: 'video', src: url, filename: label,
        _external: true, _original: url, el: null, _lastTime: 0
      };
    }
    if (PDF_EXTS_SET.has(ext)) {
      return {
        num: url, type: 'pdf', src: url, filename: label,
        _external: true, _original: url, el: null
      };
    }
    if (TEXT_EXTS_SET.has(ext)) {
      return {
        num: url, type: 'text', src: url, filename: label,
        _external: true, _original: url, el: null,
        _textLoaded: false, _text: undefined, _textError: false,
        _textPromise: null, _slidePre: null
      };
    }
    if (IMAGE_EXTS.indexOf(ext) !== -1) {
      const img = new Image();
      img.decoding = 'async';
      img.loading  = 'lazy';
      img.alt      = label;
      img.src      = url;
      return {
        num: url, type: 'img', el: img, src: url, filename: label,
        _external: true, _original: url
      };
    }

    return {
      num: url, type: 'pdf', src: url, filename: label,
      _external: true, _original: url, el: null
    };
  }

  function pointerOnMedia(e) {
    if (!e) return false;
    if (e.target && e.target.closest && e.target.closest('video, iframe')) return true;
    const path = (e.composedPath && e.composedPath()) || [];
    for (let i = 0; i < path.length; i++) {
      const n = path[i];
      if (n && n.nodeType === 1 && (n.tagName === 'VIDEO' || n.tagName === 'IFRAME')) {
        return true;
      }
    }
    return false;
  }

  /* =========================================================
     橫向清單滑鼠拖曳 / 滾輪左右捲動
     ========================================================= */
  function enableDragScroll(scroller, signal) {
    if (!scroller) return;

    let down = false, moved = false, pid = null;
    let startX = 0, startY = 0, startLeft = 0;
    let lastX = 0, lastT = 0, velocity = 0;
    let rafId = 0;
    let dragEndTime = -1e9;

    const canScroll = () => scroller.scrollWidth > scroller.clientWidth + 1;

    function stopMomentum() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      scroller.classList.remove('dragging');
      scroller.style.scrollBehavior = '';
    }

    function finishDrag() {
      rafId = 0;
      scroller.classList.remove('dragging');
      scroller.style.scrollBehavior = '';
      dragEndTime = performance.now();
    }

    scroller.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') return;
      if (e.button !== 0) return;
      if (!canScroll()) return;

      stopMomentum();

      down = true; moved = false; pid = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      startLeft = scroller.scrollLeft;
      lastX = e.clientX; lastT = performance.now(); velocity = 0;
    }, { signal });

    window.addEventListener('pointermove', e => {
      if (!down || e.pointerId !== pid) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (!moved) {
        if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        if (Math.abs(dy) > Math.abs(dx)) {
          down = false; pid = null;
          return;
        }
        moved = true;
        stopMomentum();
        scroller.classList.add('dragging');
        scroller.style.scrollBehavior = 'auto';
      }

      if (e.cancelable) e.preventDefault();
      scroller.scrollLeft = startLeft - dx;

      const now = performance.now();
      const dt = now - lastT;
      if (dt > 0) {
        velocity = (e.clientX - lastX) / dt;
        lastX = e.clientX;
        lastT = now;
      }
    }, { passive: false, signal });

    function endDrag(e) {
      if (!down || e.pointerId !== pid) return;
      down = false; pid = null;

      if (!moved) return;
      moved = false;

      let v = velocity * 16;
      if (Math.abs(v) < 1.5) { finishDrag(); return; }

      const step = () => {
        v *= 0.94;
        if (Math.abs(v) < 0.6) { finishDrag(); return; }
        const before = scroller.scrollLeft;
        scroller.scrollLeft = before - v;
        if (scroller.scrollLeft === before) { finishDrag(); return; }
        rafId = requestAnimationFrame(step);
      };
      rafId = requestAnimationFrame(step);
    }

    window.addEventListener('pointerup', endDrag, { signal });
    window.addEventListener('pointercancel', endDrag, { signal });

    scroller.addEventListener('click', e => {
      if (performance.now() - dragEndTime > 320) return;
      e.stopPropagation();
      e.preventDefault();
    }, { capture: true, signal });

    scroller.addEventListener('wheel', e => {
      if (!canScroll()) return;
      if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;

      const atStart = scroller.scrollLeft <= 0;
      const atEnd   = scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 1;
      if ((e.deltaY < 0 && atStart) || (e.deltaY > 0 && atEnd)) return;

      e.preventDefault();
      scroller.scrollLeft += e.deltaY;
    }, { passive: false, signal });
  }

  /* =========================================================
     4. 讀文字檔
     ========================================================= */
  async function fetchTextSmart(url) {
    let res;
    try { res = await fetch(url, { cache: 'no-store' }); }
    catch (_) { return null; }
    if (!res.ok) return null;

    const buf = await res.arrayBuffer();
    if (!buf.byteLength) return '';

    const b = new Uint8Array(buf);
    if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF)
      return new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/, '');
    if (b[0] === 0xFF && b[1] === 0xFE) {
      try { return new TextDecoder('utf-16le').decode(buf).replace(/^\uFEFF/, ''); } catch (_) {}
    }
    if (b[0] === 0xFE && b[1] === 0xFF) {
      try { return new TextDecoder('utf-16be').decode(buf).replace(/^\uFEFF/, ''); } catch (_) {}
    }

    let text = new TextDecoder('utf-8').decode(buf);
    if (!text.includes('\uFFFD')) return text.replace(/^\uFEFF/, '');

    for (const enc of ['big5', 'big5-hkscs', 'ms950', 'gbk', 'gb18030']) {
      try {
        const t = new TextDecoder(enc).decode(buf);
        if (t && !t.includes('\uFFFD')) return t.replace(/^\uFEFF/, '');
      } catch (_) {}
    }
    return text;
  }

  async function fetchFirstText(urls) {
    for (let i = 0; i < urls.length; i++) {
      const t = await fetchTextSmart(urls[i]);
      if (t) return t;
    }
    return null;
  }

  /* =========================================================
     5. 找出「目前這一層」的子目錄
     ========================================================= */
  async function discoverDirs(base) {
    const ordered = [];
    const seen    = new Set();

    const addUnique = (name) => {
      if (!name) return;
      if (name.includes('/') || name.startsWith('.')) return;
      if (seen.has(name)) return;
      seen.add(name);
      ordered.push(name);
    };

    const listText = await fetchFirstText(DIR_FILES.map(f => joinPath(base, f)));
    if (listText) {
      listText.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
        const s = line.trim();
        if (!s || s.startsWith('#')) return;
        addUnique(s.replace(/\/+$/, ''));
      });
    }

    if (!base) MANUAL_DIRS.forEach(addUnique);

    return ordered;
  }

  /* =========================================================
     6. 解析 content.txt
     ========================================================= */
  function parseContent(text) {
    const list = [];
    const seen = new Set();

    text.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
      const s = line.trim();
      if (!s || s.startsWith('#')) return;

      const m = s.match(/^(\S+)(?:\s+([\s\S]*))?$/);
      if (!m) return;

      const name = m[1];
      const cap  = (m[2] || '').trim();

      if (seen.has(name)) return;
      seen.add(name);
      list.push({ name, cap });
    });

    return list;
  }

  function splitKnownExt(name) {
    const m = String(name).match(/^(.*)\.([A-Za-z0-9]+)$/);
    if (!m) return null;
    const ext = m[2].toLowerCase();
    if (IMAGE_EXTS.indexOf(ext) !== -1 ||
        VIDEO_EXTS_SET.has(ext) ||
        TEXT_EXTS_SET.has(ext) ||
        PDF_EXTS_SET.has(ext)) {
      return { base: m[1], ext: ext };
    }
    return null;
  }

  function freshVideoUrl(src, bustCache) {
    if (!bustCache) return src;
    const sep = src.indexOf('?') === -1 ? '?' : '&';
    return src + sep + '_t=' + Date.now() + '_' +
           Math.random().toString(36).slice(2, 7);
  }

  function hardDestroyVideo(v) {
    if (!v) return;
    try {
      v.pause();
      v.removeAttribute('src');
      v.srcObject = null;
      v.load();
    } catch (_) {}
    if (v._objectUrl) {
      try { URL.revokeObjectURL(v._objectUrl); } catch (_) {}
      v._objectUrl = null;
    }
    if (v.parentNode) v.parentNode.removeChild(v);
  }

  function attachSeekableFallback(video, item) {
    if (!video || !item || video._seekChecked) return;
    video._seekChecked = true;

    function upgrade() {
      if (!video.isConnected) return;
      if (!isFinite(video.duration) || video.duration <= 0) return;

      let canSeek = false;
      try {
        canSeek = video.seekable.length > 0 &&
                  video.seekable.end(video.seekable.length - 1) > 0.1;
      } catch (_) {}
      if (canSeek || video._objectUrl) return;

      const startAt = isFinite(video.currentTime) ? video.currentTime : 0;
      const wasPlaying = !video.paused;

      fetch(item.src, { cache: 'force-cache' })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.blob();
        })
        .then(blob => {
          if (!video.isConnected) return;
          const url = URL.createObjectURL(blob);
          video._objectUrl = url;
          video.src = url;
          video.load();
          try { video.currentTime = Math.max(startAt, 0.05); } catch (_) {}

          const restore = () => {
            if (!video.isConnected) return;
            try {
              if (startAt > 0.05 && isFinite(video.duration) && video.duration > 0) {
                video.currentTime = Math.min(startAt, Math.max(0, video.duration - 0.05));
              }
            } catch (_) {}
            if (wasPlaying) {
              const p = video.play();
              if (p && typeof p.catch === 'function') p.catch(() => {});
            }
          };

          if (video.readyState >= 1) restore();
          else video.addEventListener('loadedmetadata', restore, { once: true });
        })
        .catch(() => { video._seekChecked = false; });
    }

    if (video.readyState >= 1) setTimeout(upgrade, 800);
    else video.addEventListener('loadedmetadata', () => setTimeout(upgrade, 800), { once: true });
  }

  function clearVideoSlot(container) {
    if (!container) return;
    container.querySelectorAll('video').forEach(hardDestroyVideo);
    const overlay = container.querySelector('.video-error');
    if (overlay) overlay.remove();
  }

  function saveVideoState(item) {
    if (!item || item.type !== 'video') return;
    const node = item._slideEl && item._slideEl.querySelector('video');
    if (!node) return;
    const t = node.currentTime;
    if (isFinite(t) && t > 0.1) item._lastTime = t;
  }

  function showVideoError(container, item, msg) {
    if (!container) return;
    clearVideoSlot(container);

    const overlay = document.createElement('div');
    overlay.className = 'video-error';

    const p = document.createElement('p');
    p.textContent = msg;
    overlay.appendChild(p);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const retryBtn = document.createElement('button');
    retryBtn.type = 'button';
    retryBtn.textContent = '重新載入';
    retryBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (!item._slideEl) return;
      setTimeout(() => {
        if (!item._slideEl) return;
        createAndMountVideo(item, item._slideEl, (v) => {
          const p2 = v.play();
          if (p2 && typeof p2.catch === 'function') p2.catch(() => {});
        }, { bustCache: true });
      }, 200);
    });
    actions.appendChild(retryBtn);

    const a = document.createElement('a');
    a.href = item._original || item.src;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '在新窗口打开';
    actions.appendChild(a);

    overlay.appendChild(actions);
    container.appendChild(overlay);
  }

  function createAndMountVideo(item, container, onReady, opts) {
    clearVideoSlot(container);
    opts = opts || {};

    const v = document.createElement('video');
    v.preload     = 'auto';
    v.controls    = true;
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    v.src = freshVideoUrl(item.src, opts.bustCache);

    let failed = false;
    const fail = (msg) => {
      if (failed) return;
      failed = true;
      showVideoError(container, item, msg);
    };

    v.addEventListener('error', () => {
      if (!v.isConnected) return;
      const err = v.error;
      if (!err) return;
      if (err.code === err.MEDIA_ERR_SRC_NOT_SUPPORTED) {
        fail('此影片格式不受瀏覽器支援（可能是 HEVC/H.265 編碼）。');
      } else if (err.code === err.MEDIA_ERR_DECODE) {
        fail('影片解碼失敗（編碼或解析度超出瀏覽器能力）。');
      }
    });

    const checkTrack = () => {
      if (!v.isConnected || failed) return;
      if (v.readyState >= 1 && (v.videoWidth === 0 || v.videoHeight === 0)) {
        fail('此影片的視頻軌道無法解碼（可能是 HEVC/H.265 編碼），瀏覽器只能播放聲音。請用系統播放器打開。');
      }
    };

    v.addEventListener('loadedmetadata', () => {
      if (failed) return;
      const t = item._lastTime;
      if (t && isFinite(t) && t > 0.1) {
        try {
          if (!isFinite(v.duration) || t < v.duration - 0.5) {
            v.currentTime = t;
          }
        } catch (_) {}
      }
      setTimeout(checkTrack, VIDEO_TRACK_CHECK_DELAY);
    });
    v.addEventListener('loadeddata', checkTrack);

    container.appendChild(v);
    v.load();
    item.el = v;
    attachSeekableFallback(v, item);

    if (onReady) {
      let called = false;
      const fire = () => {
        if (called || failed) return;
        called = true;
        if (!v.isConnected) return;
        onReady(v);
      };
      if (v.readyState >= 2) fire();
      else {
        v.addEventListener('loadeddata', fire, { once: true });
        v.addEventListener('canplay', fire, { once: true });
      }
    }

    return v;
  }

  function loadMedia(dir, rawName) {
    const name = String(rawName).trim();
    if (!name) return null;

    if (isAbsoluteUrl(name)) return makeExternalItem(name);

    const known = splitKnownExt(name);
    if (!known) return null;

    const url = joinPath(dir, encodeURI(name));

    if (VIDEO_EXTS_SET.has(known.ext)) {
      return {
        num: name, type: 'video', src: url, filename: name, el: null,
        _lastTime: 0
      };
    }

    if (TEXT_EXTS_SET.has(known.ext)) {
      return {
        num: name, type: 'text', src: url, filename: name, el: null,
        _textLoaded: false, _text: undefined, _textError: false,
        _textPromise: null, _slidePre: null
      };
    }

    if (PDF_EXTS_SET.has(known.ext)) {
      return { num: name, type: 'pdf', src: url, filename: name, el: null };
    }

    const img = new Image();
    img.decoding = 'async';
    img.loading  = 'lazy';
    img.alt      = name;
    img.src      = url;
    return { num: name, type: 'img', el: img, src: url, filename: name };
  }

  /* =========================================================
     7-1. 文字檔非同步載入
     ========================================================= */
  function loadTextContent(item) {
    if (item._textLoaded) return Promise.resolve(item._text);
    if (item._textPromise) return item._textPromise;

    item._textPromise = (async () => {
      const text = await fetchTextSmart(item.src);
      item._textLoaded = true;
      if (text === null) {
        item._text = null;
        item._textError = true;
      } else {
        item._text = text;
        item._textError = false;
      }
      if (item._slidePre) {
        renderTextInto(item._slidePre, item);
      }
      return item._text;
    })();

    return item._textPromise;
  }

  function textDisplayValue(item) {
    if (!item._textLoaded) return '載入中…';
    if (item._textError)   return '（無法載入此文字檔）';
    return item._text || '（空白文字檔）';
  }

  function renderTextInto(node, item) {
    node.textContent = textDisplayValue(item);
    node.classList.toggle('error', !!item._textError);
  }

  /* =========================================================
     7-2. PDF / 外部文件掛載（iframe）
     ========================================================= */
  function mountPdfInto(container, item, opts) {
    if (!container || !item) return;
    opts = opts || {};

    const wrap = document.createElement('div');
    wrap.className = opts.wrapClass || 'pdf-frame';

    const iframe = document.createElement('iframe');
    iframe.src = item.src;
    iframe.title = item.filename || item.num || 'PDF';
    iframe.setAttribute('loading', opts.eager ? 'eager' : 'lazy');
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    iframe.setAttribute('allow', 'fullscreen');
    wrap.appendChild(iframe);

    const openLink = document.createElement('a');
    openLink.href = item._original || item.src;
    openLink.target = '_blank';
    openLink.rel = 'noopener';
    openLink.className = opts.linkClass || 'pdf-open-link';
    openLink.textContent = opts.linkText || '↗ 在新視窗開啟 PDF';
    wrap.appendChild(openLink);

    container.appendChild(wrap);
    return wrap;
  }

  function clearPdfSlot(container) {
    if (!container) return;
    container.querySelectorAll('.pdf-frame, .lb-pdf').forEach(n => n.remove());
  }

  /* =========================================================
     8. 燈箱 + 高清縮放系統
     ========================================================= */
  const zoom = { scale: 1, tx: 0, ty: 0, MIN: 1, MAX: 12 };

  let lbImgEl    = null;
  let lbReady    = false;
  let lbBase     = { w: 1, h: 1 };

  const pointers   = new Map();
  let dragState    = null;
  let pinchState   = null;
  let pressTarget  = null;
  let pressMoved   = false;
  let pressStartX  = 0;
  let pressStartY  = 0;
  let lastTapTime  = 0;
  let lastTapX     = 0;
  let lastTapY     = 0;

  function currentLbImg() {
    return (lbImgEl && lbReady) ? lbImgEl : null;
  }

  function updateZoomUI() {
    if (zoomValEl) zoomValEl.textContent = Math.round(zoom.scale * 100) + '%';
  }

  function computeBase() {
    const img = lbImgEl;
    if (!img || !img.naturalWidth) return;

    const cw = lbBody.clientWidth  || window.innerWidth;
    const ch = lbBody.clientHeight || window.innerHeight;
    const nw = img.naturalWidth;
    const nh = img.naturalHeight;

    const s = Math.min(cw / nw, ch / nh, 1);
    lbBase.w = Math.max(1, nw * s);
    lbBase.h = Math.max(1, nh * s);
  }

  function applyZoom(animate) {
    const img = lbImgEl;
    if (!img || !lbReady) { updateZoomUI(); return; }

    zoom.scale = clamp(zoom.scale, zoom.MIN, zoom.MAX);
    if (zoom.scale <= 1.0001) {
      zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    }

    img.style.transition = animate
      ? 'width .22s cubic-bezier(.22,.61,.36,1), height .22s cubic-bezier(.22,.61,.36,1), transform .22s cubic-bezier(.22,.61,.36,1)'
      : 'none';

    const w = Math.round(lbBase.w * zoom.scale);
    const h = Math.round(lbBase.h * zoom.scale);
    img.style.width     = w + 'px';
    img.style.height    = h + 'px';
    img.style.maxWidth  = 'none';
    img.style.maxHeight = 'none';

    img.style.transform =
      'translate(-50%, -50%) translate(' + zoom.tx.toFixed(2) + 'px, ' + zoom.ty.toFixed(2) + 'px)';

    img.classList.toggle('zoomed', zoom.scale > 1.001);
    updateZoomUI();
  }

  function zoomTo(newScale, ax, ay, animate) {
    const img = currentLbImg();
    if (!img) return;

    newScale = clamp(newScale, zoom.MIN, zoom.MAX);
    if (Math.abs(newScale - zoom.scale) < 0.0005) return;

    const r   = lbBody.getBoundingClientRect();
    const ccX = r.left + r.width  / 2;
    const ccY = r.top  + r.height / 2;
    const k   = newScale / zoom.scale;

    zoom.tx = (ax - ccX) - (ax - ccX - zoom.tx) * k;
    zoom.ty = (ay - ccY) - (ay - ccY - zoom.ty) * k;
    zoom.scale = newScale;

    applyZoom(animate);
  }

  function resetZoom(animate) {
    if (!lbImgEl) return;
    zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    applyZoom(animate);
  }

  function openLightbox(item) {
    const carVid = document.querySelector('.carousel video');
    if (carVid && !carVid.paused) {
      pausedCarouselVideo = carVid;
      try { carVid.pause(); } catch (_) {}
    }

    lbBody.innerHTML = '';
    lbCap.textContent = '';
    lbImgEl = null;
    lbReady = false;
    zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    pointers.clear();
    dragState = null; pinchState = null;
    pressTarget = null; pressMoved = false;
    lastTapTime = 0;

    if (item.type === 'text') {
      const pre = document.createElement('pre');
      pre.className = 'lb-text';
      renderTextInto(pre, item);
      lbBody.appendChild(pre);
      lbTools.hidden = true;

      if (!item._textLoaded) {
        loadTextContent(item).then(() => {
          if (!pre.isConnected) return;
          renderTextInto(pre, item);
        });
      }
    } else if (item.type === 'video') {
      const v = document.createElement('video');
      v.preload     = 'auto';
      v.src         = item.src;
      v.controls    = true;
      v.playsInline = true;
      v.autoplay    = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');

      let failed = false;
      const fail = (msg) => {
        if (failed) return;
        failed = true;
        hardDestroyVideo(v);
        const wrap = document.createElement('div');
        wrap.className = 'lb-error';
        const p = document.createElement('p');
        p.textContent = msg;
        wrap.appendChild(p);
        const a = document.createElement('a');
        a.href = item._original || item.src;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = '在新窗口打开视频';
        wrap.appendChild(a);
        lbBody.innerHTML = '';
        lbBody.appendChild(wrap);
      };

      v.addEventListener('error', () => {
        if (!lbBody.contains(v)) return;
        const err = v.error;
        if (!err) return;
        if (err.code === err.MEDIA_ERR_SRC_NOT_SUPPORTED) {
          fail('此影片格式不受瀏覽器支援（可能是 HEVC/H.265 編碼）。');
        } else if (err.code === err.MEDIA_ERR_DECODE) {
          fail('影片解碼失敗（編碼或解析度超出瀏覽器能力）。');
        }
      });

      const checkTrack = () => {
        if (!v.isConnected || failed) return;
        if (v.readyState >= 1 && (v.videoWidth === 0 || v.videoHeight === 0)) {
          fail('此影片的視頻軌道無法解碼（可能是 HEVC/H.265 編碼），瀏覽器只能播放聲音。請用系統播放器打開。');
        }
      };
      v.addEventListener('loadedmetadata', () => {
        if (failed) return;
        setTimeout(checkTrack, VIDEO_TRACK_CHECK_DELAY);
      });
      v.addEventListener('loadeddata', checkTrack);

      lbBody.appendChild(v);
      lbTools.hidden = true;
      v.load();
      attachSeekableFallback(v, item);

      const tryPlay = () => {
        if (!v.isConnected || failed) return;
        const p = v.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      };
      if (v.readyState >= 2) tryPlay();
      else {
        v.addEventListener('loadeddata', tryPlay, { once: true });
        v.addEventListener('canplay', tryPlay, { once: true });
      }
    } else if (item.type === 'pdf') {
      mountPdfInto(lbBody, item, {
        wrapClass: 'lb-pdf',
        linkClass: 'lb-pdf-open',
        linkText: '↗ 在新視窗開啟 PDF',
        eager: true
      });
      lbTools.hidden = true;
    } else {
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.cap || item.filename || item.num;
      img.draggable = false;
      img.style.opacity = '0';
      lbBody.appendChild(img);
      lbImgEl = img;
      lbTools.hidden = false;

      const init = () => {
        if (!lbImgEl || lbImgEl !== img) return;
        lbReady = true;
        computeBase();
        zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
        applyZoom(false);
        img.style.opacity = '';
      };

      if (img.complete && img.naturalWidth) init();
      else img.addEventListener('load', init, { once: true });
    }

    lbCap.textContent = item.cap || '';
    lbCap.hidden = !item.cap;
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lbBody.querySelectorAll('video').forEach(hardDestroyVideo);
    lbBody.querySelectorAll('.lb-pdf, .pdf-frame').forEach(n => n.remove());
    lbBody.innerHTML = '';
    lbCap.textContent = '';
    lbCap.hidden = true;
    lightbox.hidden = true;
    document.body.style.overflow = '';

    lbImgEl = null;
    lbReady = false;
    zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    pointers.clear();
    dragState = null; pinchState = null;
    pressTarget = null; pressMoved = false;
    lbTools.hidden = true;

    if (pausedCarouselVideo && pausedCarouselVideo.isConnected) {
      const p = pausedCarouselVideo.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }
    pausedCarouselVideo = null;
  }

  const lbCloseBtn = document.getElementById('lbClose');
  if (lbCloseBtn) {
    lbCloseBtn.addEventListener('click', e => {
      e.stopPropagation();
      closeLightbox();
    });
  }

  lightbox.addEventListener('pointerdown', e => {
    pressTarget = e.target;
    pressMoved  = false;
    pressStartX = e.clientX;
    pressStartY = e.clientY;

    if (e.pointerType === 'mouse' && e.button !== 0) return;

    const img = currentLbImg();
    if (!img || e.target !== img) return;

    e.preventDefault();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { lightbox.setPointerCapture(e.pointerId); } catch (_) {}

    if (pointers.size === 1) {
      dragState = { x: e.clientX, y: e.clientY, tx: zoom.tx, ty: zoom.ty };
      img.classList.add('grabbing');
      img.classList.remove('zoomed');
    } else if (pointers.size === 2) {
      const pts = [...pointers.values()];
      const r   = lbBody.getBoundingClientRect();
      pinchState = {
        dist:  Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1,
        cx:    (pts[0].x + pts[1].x) / 2,
        cy:    (pts[0].y + pts[1].y) / 2,
        scale: zoom.scale,
        tx:    zoom.tx,
        ty:    zoom.ty,
        ccX:   r.left + r.width  / 2,
        ccY:   r.top  + r.height / 2
      };
      dragState = null;
      img.classList.remove('grabbing');
    }
  });

  lightbox.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    pressMoved = true;

    const img = currentLbImg();
    if (!img) return;

    if (pointers.size >= 2 && pinchState) {
      const pts  = [...pointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
      const cx   = (pts[0].x + pts[1].x) / 2;
      const cy   = (pts[0].y + pts[1].y) / 2;

      const newScale = clamp(pinchState.scale * (dist / pinchState.dist),
                             zoom.MIN, zoom.MAX);
      const k  = newScale / pinchState.scale;
      const dx = cx - pinchState.cx;
      const dy = cy - pinchState.cy;

      zoom.tx = (pinchState.cx - pinchState.ccX)
                - (pinchState.cx - pinchState.ccX - pinchState.tx) * k + dx;
      zoom.ty = (pinchState.cy - pinchState.ccY)
                - (pinchState.cy - pinchState.ccY - pinchState.ty) * k + dy;
      zoom.scale = newScale;

      applyZoom(false);
      if (e.cancelable) e.preventDefault();
      return;
    }

    if (dragState && zoom.scale > 1.001) {
      zoom.tx = dragState.tx + (e.clientX - dragState.x);
      zoom.ty = dragState.ty + (e.clientY - dragState.y);
      applyZoom(false);
      if (e.cancelable) e.preventDefault();
    }
  });

  function endPointer(e) {
    if (pointers.has(e.pointerId)) pointers.delete(e.pointerId);
    try { lightbox.releasePointerCapture(e.pointerId); } catch (_) {}

    const img = currentLbImg();

    if (pointers.size < 2) pinchState = null;

    if (pointers.size === 1) {
      const p = [...pointers.values()][0];
      dragState = { x: p.x, y: p.y, tx: zoom.tx, ty: zoom.ty };
      if (img) img.classList.add('grabbing');
    } else if (pointers.size === 0) {
      dragState = null;
      if (img) {
        img.classList.remove('grabbing');
        img.classList.toggle('zoomed', zoom.scale > 1.001);
      }
    }
  }

  lightbox.addEventListener('pointerup', e => {
    const wasPress = pressTarget;
    const wasMoved = pressMoved;
    const img      = currentLbImg();
    const wasImg   = img && wasPress === img;
    const pCount   = pointers.size;

    const bgDist = Math.hypot(e.clientX - pressStartX, e.clientY - pressStartY);
    const bgMoved = bgDist > 8;

    endPointer(e);

    if (!wasImg && !wasMoved && !bgMoved &&
        (wasPress === lightbox || wasPress === lbBody)) {
      pressTarget = null; pressMoved = false;
      closeLightbox();
      return;
    }

    if (!wasMoved && wasImg && pCount <= 1) {
      const now = performance.now();
      if (now - lastTapTime < 320 &&
          Math.abs(e.clientX - lastTapX) < 40 &&
          Math.abs(e.clientY - lastTapY) < 40) {
        lastTapTime = 0;
        if (zoom.scale > 1.05) resetZoom(true);
        else                   zoomTo(2.5, e.clientX, e.clientY, true);
      } else {
        lastTapTime = now;
        lastTapX = e.clientX;
        lastTapY = e.clientY;
      }
    }

    pressTarget = null;
    pressMoved  = false;
  });

  lightbox.addEventListener('pointercancel', e => {
    endPointer(e);
    pressTarget = null;
    pressMoved  = false;
  });

  lightbox.addEventListener('wheel', e => {
    const img = currentLbImg();
    if (!img) return;
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0018);
    zoomTo(zoom.scale * factor, e.clientX, e.clientY, false);
  }, { passive: false });

  lbTools.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    e.stopPropagation();

    const img = currentLbImg();
    if (!img) return;

    const rect = lbBody.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;

    const act = btn.dataset.act;
    if (act === 'in')    zoomTo(zoom.scale * 1.4, cx, cy, true);
    if (act === 'out')   zoomTo(zoom.scale / 1.4, cx, cy, true);
    if (act === 'reset') resetZoom(true);
  });

  document.addEventListener('keydown', e => {
    if (lightbox.hidden) return;
    if (e.key === 'Escape') { closeLightbox(); return; }

    const img = currentLbImg();
    if (!img) return;

    const rect = lbBody.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;

    if (e.key === '+' || e.key === '=') {
      zoomTo(zoom.scale * 1.35, cx, cy, true); e.preventDefault();
    } else if (e.key === '-' || e.key === '_') {
      zoomTo(zoom.scale / 1.35, cx, cy, true); e.preventDefault();
    } else if (e.key === '0') {
      resetZoom(true); e.preventDefault();
    }
  });

  let lbResizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(lbResizeTimer);
    lbResizeTimer = setTimeout(() => {
      if (lightbox.hidden || !lbImgEl || !lbReady) return;
      computeBase();
      if (zoom.scale > 1.001) {
        resetZoom(false);
      } else {
        applyZoom(false);
      }
    }, 140);
  });

  /* =========================================================
     9. 麵包屑（直接寫入 header 內）
     ========================================================= */
  function renderCrumbs(pathSegs) {
    if (!crumbsEl) return;
    crumbsEl.innerHTML = '';

    if (!pathSegs || pathSegs.length === 0) {
      crumbsEl.appendChild(el('span', 'current', '台電夏令營'));
      return;
    }

    const rootA = el('a', null, '台電夏令營');
    rootA.href = '#/';
    crumbsEl.appendChild(rootA);

    pathSegs.forEach((seg, i) => {
      crumbsEl.appendChild(el('span', 'sep', '›'));
      if (i === pathSegs.length - 1) {
        crumbsEl.appendChild(el('span', 'current', seg));
      } else {
        const a = el('a', null, seg);
        a.href = '#/' + pathSegs.slice(0, i + 1).map(encodeURIComponent).join('/');
        crumbsEl.appendChild(a);
      }
    });
  }

  /* =========================================================
     10. 畫廊區塊
     ========================================================= */
  function buildGalleryBlock(dir, items, container, signal) {
    const thumbs = el('div', 'thumbs');
    enableDragScroll(thumbs, signal);

    const rail = el('div', 'rail');
    const railHead = el('div', 'rail-head');
    railHead.appendChild(el('span', 'rail-label', 'FRAMES'));
    railHead.appendChild(el('span', 'rail-count', pad2(items.length)));
    rail.appendChild(railHead);
    rail.appendChild(thumbs);

    const thumbBtns = items.map((it, i) => {
      const label = it.filename || it.num;
      const b = el('button', 'thumb', label);
      b.type = 'button';
      if (it.type === 'video') b.classList.add('is-video');
      if (it.type === 'text')  b.classList.add('is-text');
      if (it.type === 'pdf')   b.classList.add('is-pdf');
      b.title = it.cap ? (label + ' — ' + it.cap) : label;
      b.setAttribute('aria-label', '跳到 ' + label);
      b.addEventListener('click', () => goTo(i));
      thumbs.appendChild(b);
      return b;
    });

    const carousel = el('div', 'carousel');
    const track    = el('div', 'track');

    items.forEach(it => {
      const slide = el('div', 'slide');
      it._slideEl = slide;
      if (it.type === 'img' && it.el) {
        slide.appendChild(it.el);
      }
      track.appendChild(slide);
    });
    carousel.appendChild(track);

    const prevBtn = el('button', 'nav prev');
    prevBtn.type = 'button';
    prevBtn.setAttribute('aria-label', '上一張');
    prevBtn.textContent = '‹';

    const nextBtn = el('button', 'nav next');
    nextBtn.type = 'button';
    nextBtn.setAttribute('aria-label', '下一張');
    nextBtn.textContent = '›';

    const counter = el('div', 'counter');

    carousel.appendChild(prevBtn);
    carousel.appendChild(nextBtn);
    carousel.appendChild(counter);

    const progressBar = el('i');
    const progress = el('div', 'progress');
    progress.appendChild(progressBar);
    carousel.appendChild(progress);
    carousel.appendChild(el('div', 'frame'));

    const capBox = el('div', 'caption');

    container.appendChild(rail);
    container.appendChild(carousel);
    container.appendChild(capBox);

    let idx = 0;
    const total = items.length;
    let activeThumb = -1;
    let mountToken = 0;

    const SWIPE_REVERSED = false;

    function centerThumb(t) {
      if (!t) return;
      const tr  = t.getBoundingClientRect();
      const cr  = thumbs.getBoundingClientRect();
      const max = Math.max(0, thumbs.scrollWidth - thumbs.clientWidth);
      const left = Math.max(0, Math.min(max,
        thumbs.scrollLeft + (tr.left - cr.left) - (cr.width - tr.width) / 2
      ));
      try {
        thumbs.scrollTo({ left, behavior: 'smooth' });
      } catch (_) {
        thumbs.scrollLeft = left;
      }
    }

    function goTo(i, animate) {
      if (animate === undefined) animate = true;
      idx = Math.max(0, Math.min(total - 1, i));

      track.style.transition = animate
        ? 'transform .3s cubic-bezier(.22,.61,.36,1)'
        : 'none';
      track.style.transform = 'translateX(' + (-idx * 100) + '%)';

      counter.textContent = pad3(idx + 1) + ' / ' + pad3(total);
      progressBar.style.transform =
        'scaleX(' + ((idx + 1) / Math.max(1, total)).toFixed(4) + ')';
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx >= total - 1;

      items.forEach((it, k) => {
        if (k !== idx && it.type === 'video') {
          saveVideoState(it);
          if (it._slideEl) clearVideoSlot(it._slideEl);
          it.el = null;
        }
        if (k !== idx && it.type === 'pdf') {
          if (it._slideEl) clearPdfSlot(it._slideEl);
        }
      });

      const curItem = items[idx];
      const token = ++mountToken;

      if (curItem.type === 'video' && curItem._slideEl) {
        clearVideoSlot(curItem._slideEl);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            setTimeout(() => {
              if (token !== mountToken) return;
              if (signal.aborted) return;
              if (!curItem._slideEl) return;

              createAndMountVideo(curItem, curItem._slideEl, (v) => {
                if (token !== mountToken) return;
                const p = v.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
              });
            }, 60);
          });
        });
      }

      if (curItem.type === 'pdf' && curItem._slideEl) {
        if (!curItem._slideEl.querySelector('.pdf-frame')) {
          clearPdfSlot(curItem._slideEl);
          mountPdfInto(curItem._slideEl, curItem, {
            wrapClass: 'pdf-frame',
            linkClass: 'pdf-open-link',
            linkText: '↗ 在新視窗開啟 PDF',
            eager: true
          });
        }
      }

      if (curItem.type === 'text' && curItem._slideEl) {
        if (!curItem._slidePre) {
          const pre = document.createElement('pre');
          pre.className = 'text-content';
          pre.textContent = '載入中…';
          curItem._slidePre = pre;
          curItem._slideEl.appendChild(pre);
        }
        renderTextInto(curItem._slidePre, curItem);
        if (!curItem._textLoaded) {
          loadTextContent(curItem);
        }
      }

      if (activeThumb !== idx) {
        if (thumbBtns[activeThumb]) thumbBtns[activeThumb].classList.remove('active');
        const t = thumbBtns[idx];
        if (t) {
          t.classList.add('active');
          centerThumb(t);
        }
        activeThumb = idx;
      }

      const it = items[idx];
      capBox.innerHTML = '';

      const nameTag = el('span', 'num', it.filename || it.num);
      if (it.type === 'video') nameTag.classList.add('is-video');
      if (it.type === 'text')  nameTag.classList.add('is-text');
      if (it.type === 'pdf')   nameTag.classList.add('is-pdf');
      capBox.appendChild(nameTag);

      if (it.cap) {
        capBox.classList.remove('empty');
        capBox.appendChild(document.createTextNode(it.cap));
      } else {
        capBox.classList.add('empty');
        capBox.appendChild(document.createTextNode(
          it.type === 'video' ? '（影片，無說明）' :
          it.type === 'text'  ? '（純文字檔，無說明）' :
          it.type === 'pdf'   ? '（PDF 文件，無說明）' :
                                '（無說明）'
        ));
      }

      capBox.style.animation = 'none';
      void capBox.offsetWidth;
      capBox.style.animation = '';
    }

    prevBtn.addEventListener('click', () => goTo(idx - 1));
    nextBtn.addEventListener('click', () => goTo(idx + 1));

    let down = false, dragging = false;
    let startX = 0, startY = 0;
    let activePointer = null;

    function onDown(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest('video')) return;
      if (e.target && e.target.closest && e.target.closest('a')) return;
      if (e.target && e.target.closest && e.target.closest('button')) return;
      if (e.target && e.target.closest && e.target.closest('iframe')) return;
      if (e.target && e.target.closest && e.target.closest('pre.text-content')) return;
      if (e.target && e.target.closest && e.target.closest('.pdf-frame')) return;
      if (pointerOnMedia(e)) return;

      down = true;
      dragging = false;
      activePointer = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      track.style.transition = 'none';
    }

    function onMove(e) {
      if (!down || e.pointerId !== activePointer) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (!dragging) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        if (Math.abs(dy) > Math.abs(dx)) {
          down = false;
          activePointer = null;
          goTo(idx);
          return;
        }
        dragging = true;
      }

      if (e.cancelable) e.preventDefault();

      const w = carousel.offsetWidth || 1;
      const visualDx = SWIPE_REVERSED ? -dx : dx;
      const pct = (-idx * 100) + (visualDx / w) * 100;
      track.style.transform = 'translateX(' + pct + '%)';
    }

    function onUp(e) {
      if (!down) return;
      if (activePointer !== null && e.pointerId !== activePointer) return;

      const wasDragging = dragging;
      const dx = e.clientX - startX;
      down = false;
      dragging = false;
      activePointer = null;

      if (wasDragging) {
        const threshold = Math.max(50, carousel.offsetWidth * 0.15);
        if (dx < -threshold)      goTo(SWIPE_REVERSED ? idx - 1 : idx + 1);
        else if (dx > threshold)  goTo(SWIPE_REVERSED ? idx + 1 : idx - 1);
        else                      goTo(idx);
      } else {
        if (pointerOnMedia(e)) return;
        if (e.target && e.target.closest && e.target.closest('.video-error')) return;
        if (e.target && e.target.closest && e.target.closest('iframe')) return;
        if (e.target && e.target.closest && e.target.closest('.pdf-open-link')) return;
        openLightbox(items[idx]);
      }
    }

    track.addEventListener('pointerdown', onDown, { signal });
    document.addEventListener('pointermove', onMove, { passive: false, signal });
    document.addEventListener('pointerup', onUp, { signal });
    document.addEventListener('pointercancel', onUp, { signal });

    if (device.current === 'desktop') {
      document.addEventListener('keydown', e => {
        if (!lightbox.hidden) return;
        if (e.key === 'ArrowLeft')  { goTo(idx - 1); e.preventDefault(); }
        if (e.key === 'ArrowRight') { goTo(idx + 1); e.preventDefault(); }
      }, { signal });
    }

    goTo(0, false);
  }

  /* =========================================================
     10-1. 首頁 Hero
     ========================================================= */
  function mediaOrb() {
    const orb = el('div', 'orb');
    orb.setAttribute('aria-hidden', 'true');
    orb.innerHTML =
      '<div class="orb-ring r1"></div>' +
      '<div class="orb-ring r2"></div>' +
      '<div class="orb-ring r3"></div>' +
      '<div class="orb-core">' +
        '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
          '<path d="M13.4 2 4.6 13.6h5.6L9.4 22l9.2-11.9h-5.8L13.4 2Z"/>' +
        '</svg>' +
      '</div>' +
      '<span class="orb-chip c1">PHOTO</span>' +
      '<span class="orb-chip c2">VIDEO</span>' +
      '<span class="orb-chip c3">DOCUMENT</span>';
    return orb;
  }

  function buildHero(count) {
    const hero = el('section', 'hero');

    const copy = el('div', 'hero-copy');

    const kicker = el('div', 'hero-kicker');
    kicker.appendChild(el('span', 'kicker-line'));
    kicker.appendChild(el('span', 'kicker-text', 'TAIPOWER · SUMMER CAMP'));
    copy.appendChild(kicker);

    const h = el('h2', 'hero-title', '台電夏令營');
    copy.appendChild(h);

    const sub = el('p', 'hero-sub');
    sub.appendChild(document.createTextNode('從甄試、開訓、受訓到結訓，'));
    sub.appendChild(el('em', null, '完整收藏這個夏天的每一格畫面。'));
    copy.appendChild(sub);

    const stats = el('div', 'hero-stats');
    [
      ['2026', '年度'],
      [pad2(count || 0), '主題單元'],
      ['03', '媒體類型']
    ].forEach(function (pair) {
      const s = el('div', 'stat');
      s.appendChild(el('b', null, pair[0]));
      s.appendChild(el('span', null, pair[1]));
      stats.appendChild(s);
    });
    copy.appendChild(stats);

    hero.appendChild(copy);
    hero.appendChild(mediaOrb());
    return hero;
  }

  /* =========================================================
     11. 渲染單一目錄
     ========================================================= */
  async function renderDir(pathSegs) {
    if (pageAbort) { pageAbort.abort(); pageAbort = null; }
    pageAbort = new AbortController();
    const signal = pageAbort.signal;

    const base = pathSegs.join('/');
    const isRoot = pathSegs.length === 0;

    document.title = isRoot ? '台電夏令營' : (pathSegs.join(' / ') + ' — 台電夏令營');

    /* ★ 更新 header 中的麵包屑 */
    renderCrumbs(pathSegs);

    /* ★ 內頁需要與 header 之間留一點呼吸空間 */
    view.classList.toggle('has-crumbs-in-header', !isRoot);

    view.innerHTML = '';
    view.appendChild(el('p', 'hint', '載入中…'));

    const [subDirs, txt] = await Promise.all([
      discoverDirs(base),
      fetchFirstText(CONTENT_FILES.map(f => joinPath(base, f)))
    ]);
    if (signal.aborted) return;

    const entries = txt ? parseContent(txt) : [];

    const items   = [];
    const missing = [];

    entries.forEach(e => {
      const displayName = e.name;
      const capRaw      = e.cap;
      let it = null;

      if (isAbsoluteUrl(capRaw)) {
        it = makeExternalItem(capRaw);
        if (it) {
          it.filename = displayName;
          it.num      = displayName;
          it.cap      = '';
        }
      }

      if (!it) {
        if (isAbsoluteUrl(displayName)) {
          it = makeExternalItem(displayName);
          if (it) it.cap = capRaw || '';
        } else {
          it = loadMedia(base, displayName);
          if (it) it.cap = capRaw || '';
        }
      }

      if (it) items.push(it);
      else    missing.push(displayName);
    });

    const hasSubs    = subDirs.length > 0;
    const hasEntries = entries.length > 0;
    const hasItems   = items.length > 0;

    view.innerHTML = '';

    if (isRoot) view.appendChild(buildHero(subDirs.length));

    if (hasSubs) {
      const block = el('div', 'block');
      block.appendChild(el('h2', 'section-title', '主題單元'));

      const ul = el('ul', 'dir-list');
      subDirs.forEach((d, i) => {
        const li = el('li');
        li.style.animationDelay = Math.min(i * 35, 400) + 'ms';

        const a = el('a', 'dir-link');
        a.href = '#/' + pathSegs.concat(d).map(encodeURIComponent).join('/');
        a.appendChild(el('span', 'dir-name', d));
        a.appendChild(el('span', 'dir-arrow', '›'));

        li.appendChild(a);
        ul.appendChild(li);
      });
      block.appendChild(ul);
      view.appendChild(block);
    }

    if (hasItems) {
      const block = el('div', 'block');
      if (hasSubs) block.appendChild(el('h2', 'section-title', '影像紀錄'));
      buildGalleryBlock(base, items, block, signal);
      view.appendChild(block);
    }

    if (hasEntries && !hasItems) {
      const block = el('div', 'block');
      const p = el('p', 'hint');
      p.appendChild(document.createTextNode('content.txt 裡的檔名都找不到對應的圖片 / 影片 / PDF / 文字檔。'));
      if (missing.length) {
        p.appendChild(document.createElement('br'));
        p.appendChild(document.createTextNode('缺少：' + missing.join('、')));
      }
      block.appendChild(p);
      view.appendChild(block);
    }

    if (!hasSubs && !hasEntries) {
      const p = el('p', 'hint');
      if (isRoot) {
        p.appendChild(document.createTextNode('找不到任何子目錄。'));
        p.appendChild(document.createElement('br'));
        p.appendChild(document.createTextNode(
          '請在根目錄建立 dir.txt（一行一個目錄名稱），或在 index.html 的 MANUAL_DIRS 陣列中手動填入。'
        ));
      } else {
        p.appendChild(document.createTextNode('此目錄沒有子目錄，也沒有內容。'));
        p.appendChild(document.createElement('br'));
        p.appendChild(document.createTextNode(
          '可建立 dir.txt（列出子目錄）或 content.txt（列出圖片 / 影片 / PDF / 文字檔）。'
        ));
      }
      view.appendChild(p);
    }
  }

  /* =========================================================
     12. 路由
     ========================================================= */
  function currentPath() {
    const h = location.hash.replace(/^#\/?/, '');
    if (!h) return [];
    return h.split('/').filter(Boolean).map(seg => {
      try { return decodeURIComponent(seg); }
      catch (_) { return seg; }
    });
  }

  async function render() {
    window.scrollTo(0, 0);
    await renderDir(currentPath());
  }

  window.addEventListener('hashchange', render);

  render();
})();
</script>
