<!DOCTYPE html>
<html lang="zh-Hant" data-theme="steel">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app" content="gallery-index">
<title>台電受訓</title>
<style>
  /* =========================================================
     主題配色（明亮強化版）
     ========================================================= */
  html[data-theme="steel"]{
    --bg-0:#0f1a2e; --bg-1:#152238; --bg-2:#1d2d4a; --bg-3:#2a3f63;
    --line:#2a3d5e; --line-hi:#4a6591;
    --fg:#f5f9ff; --muted:#a3b4d0;
    --accent:#6ec4ff; --accent-hi:#a8dcff; --accent-fg:#031024;
    --glow:rgba(110,196,255,.5);
  }
  html[data-theme="forge"]{
    --bg-0:#1f0c05; --bg-1:#2a1108; --bg-2:#3a1810; --bg-3:#522318;
    --line:#4a1f10; --line-hi:#7a3520;
    --fg:#fff4ea; --muted:#d4a888;
    --accent:#ff8033; --accent-hi:#ffb070; --accent-fg:#1e0700;
    --glow:rgba(255,128,51,.5);
  }
  html[data-theme="jungle"]{
    --bg-0:#0a1a10; --bg-1:#0f2418; --bg-2:#163020; --bg-3:#1f422c;
    --line:#1e3a26; --line-hi:#306b44;
    --fg:#eefff4; --muted:#95c2a8;
    --accent:#5cff96; --accent-hi:#a0ffc2; --accent-fg:#021a08;
    --glow:rgba(92,255,150,.5);
  }
  html[data-theme="midnight"]{
    --bg-0:#150a2e; --bg-1:#1c1038; --bg-2:#261648; --bg-3:#35205f;
    --line:#2c1c52; --line-hi:#4f3485;
    --fg:#f6f0ff; --muted:#b6a8d4;
    --accent:#c080ff; --accent-hi:#dcb0ff; --accent-fg:#10042a;
    --glow:rgba(192,128,255,.5);
  }
  html[data-theme="carbon"]{
    --bg-0:#1a1a1a; --bg-1:#222222; --bg-2:#2a2a2a; --bg-3:#383838;
    --line:#333333; --line-hi:#5a5a5a;
    --fg:#ffffff; --muted:#b0b0b0;
    --accent:#ffffff; --accent-hi:#ffffff; --accent-fg:#0a0a0a;
    --glow:rgba(255,255,255,.4);
  }

  :root{
    --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
    --shadow:    0 8px 24px rgba(0,0,0,.45);
    --shadow-lg: 0 18px 48px rgba(0,0,0,.55);

    --slide-h:        min(72vh, 780px);
    --grid-min:       240px;
    --title-size:     1.15rem;
    --header-pad-y:   14px;
    --header-pad-x:   24px;
    --main-pad:       24px;
    --nav-size:       46px;
    --nav-font:       24px;
    --nav-offset:     14px;
    --cap-font:       .95rem;
    --cap-pad:        16px 20px 16px 22px;
    --cap-min-h:      64px;
    --thumb-font:     .8rem;
    --thumb-pad-y:    7px;
    --thumb-pad-x:    14px;
    --thumb-gap:      6px;
    --counter-font:   .78rem;
    --radius-card:    6px;
    --radius-pill:    4px;

    --theme-fade: 0.6s;
  }

  html.is-tablet{
    --slide-h:      min(62vh, 620px);
    --main-pad:     20px;
    --header-pad-y: 13px;
    --header-pad-x: 20px;
    --nav-size:     42px;
    --nav-font:     22px;
    --cap-font:     .92rem;
    --thumb-font:   .78rem;
  }
  html.is-mobile{
    --slide-h:      52vh;
    --grid-min:     150px;
    --title-size:   1rem;
    --header-pad-y: 12px;
    --header-pad-x: 14px;
    --main-pad:     14px;
    --nav-size:     38px;
    --nav-font:     20px;
    --nav-offset:   10px;
    --cap-font:     .88rem;
    --cap-pad:      12px 14px 12px 18px;
    --cap-min-h:    54px;
    --thumb-font:   .74rem;
    --thumb-pad-y:  6px;
    --thumb-pad-x:  11px;
    --thumb-gap:    5px;
    --counter-font: .72rem;
  }
  @supports (height: 100dvh){
    html.is-mobile{ --slide-h: 52dvh; }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}

  /* =========================================================
     動態背景（亮暗隨機分布）
     ========================================================= */
  #bg{
    position: fixed; inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
    background: #0f1a2e;
    contain: layout paint style;
  }
  .bg-pane{
    position: absolute; inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--theme-fade) ease,
                visibility 0s linear var(--theme-fade);
    contain: layout paint style;
    background-color: var(--bg-0);
    overflow: hidden;
    background-image:
      linear-gradient(var(--grid-color, rgba(140,205,255,.07)) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color, rgba(140,205,255,.07)) 1px, transparent 1px);
    background-size: 44px 44px;
    background-repeat: repeat;
  }
  .bg-pane.active{
    opacity: 1;
    visibility: visible;
    transition: opacity var(--theme-fade) ease,
                visibility 0s linear 0s;
  }

  .bg-pane[data-theme="steel"]   { --orb-c: 110, 196, 255; --grid-color: rgba(140,205,255,.07); }
  .bg-pane[data-theme="forge"]   { --orb-c: 255, 128, 51;  --grid-color: rgba(255,160,80,.07); }
  .bg-pane[data-theme="jungle"]  { --orb-c: 92, 255, 150;  --grid-color: rgba(150,255,190,.07); }
  .bg-pane[data-theme="midnight"]{ --orb-c: 192, 128, 255; --grid-color: rgba(210,170,255,.07); }
  .bg-pane[data-theme="carbon"]  { --orb-c: 255, 255, 255; --grid-color: rgba(255,255,255,.05); }

  .orb{
    position: absolute;
    top: 50%; left: 50%;
    display: block;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) translate(var(--ox, 0), var(--oy, 0));
    will-change: transform;
    background: radial-gradient(circle,
      rgba(var(--orb-c), var(--orb-a, .45)) 0%,
      rgba(var(--orb-c), calc(var(--orb-a, .45) * .45)) 35%,
      transparent 70%);
  }
  .orb:nth-child(1){ width: 110vmax; height: 110vmax; --orb-a: .55; }
  .orb:nth-child(2){ width:  85vmax; height:  85vmax; --orb-a: .50; }
  .orb:nth-child(3){ width:  65vmax; height:  65vmax; --orb-a: .45; }
  .orb:nth-child(4){ width:  45vmax; height:  45vmax; --orb-a: .40; }

  /* ===== 頁面本體 ===== */
  body{
    background: transparent;
    color: var(--fg);
    min-height: 100vh;
    font-family: "Rajdhani", "Oswald", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
                 system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    letter-spacing: .01em;
  }

  /* ===== Header ===== */
  header{
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px;
    padding: var(--header-pad-y) var(--header-pad-x);
    background: rgba(8,16,30,.55);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 14px rgba(0,0,0,.4);
    transition: border-color var(--theme-fade) ease;
  }
  header::after{
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%, var(--accent) 15%, var(--accent) 85%, transparent 100%);
    opacity: .9;
    box-shadow: 0 0 12px var(--glow);
    transition: background var(--theme-fade) ease, box-shadow var(--theme-fade) ease;
  }
  h1{
    font-size: var(--title-size);
    margin: 0;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    word-break: break-all;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: color var(--theme-fade) ease;
  }
  h1::before{
    content: '';
    display: inline-block;
    width: 4px;
    height: 1.1em;
    background: var(--accent);
    box-shadow: 0 0 20px var(--glow), 0 0 40px var(--glow);
    flex: 0 0 auto;
    transition: background var(--theme-fade) ease, box-shadow var(--theme-fade) ease;
  }
  .btn{
    background: var(--bg-2);
    color: var(--fg);
    border: 1px solid var(--line-hi);
    padding: 7px 16px;
    border-radius: var(--radius-pill);
    font-size: .82rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
    transition:
      background-color var(--theme-fade) ease,
      border-color var(--theme-fade) ease,
      color .15s ease,
      transform .15s ease;
  }
  .btn:hover{
    background: var(--bg-3);
    border-color: var(--accent);
    color: var(--accent-hi);
    box-shadow: var(--shadow-sm), 0 0 16px var(--glow);
  }
  .btn:active{
    transform: translateY(1px);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
  }
  html.is-mobile .btn{padding: 6px 12px; font-size: .75rem;}

  #themeBtn{
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 10px;
    background: var(--bg-2);
    border: 1px solid var(--line-hi);
    border-radius: var(--radius-pill);
    color: var(--fg);
    font-family: inherit;
    font-size: .72rem;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition:
      background-color var(--theme-fade) ease,
      border-color .15s ease,
      color var(--theme-fade) ease;
  }
  #themeBtn:hover{
    border-color: var(--accent);
    color: var(--accent-hi);
    box-shadow: var(--shadow-sm), 0 0 16px var(--glow);
  }
  #themeBtn .dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--glow);
    animation: pulse 2.4s ease-in-out infinite;
    transition: background var(--theme-fade) ease, box-shadow var(--theme-fade) ease;
  }
  #themeBtn .txt{
    min-width: 62px;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }
  #themeBtn .pause{ opacity: .5; font-size: .9rem; line-height: 1; }
  html.is-mobile #themeBtn{padding: 5px 10px; font-size: .68rem;}
  html.is-mobile #themeBtn .txt{min-width: 52px;}

  @keyframes pulse{
    0%,100%{ opacity: 1;   transform: scale(1); }
    50%    { opacity: .55; transform: scale(.85); }
  }

  /* ===== Main ===== */
  main{
    padding: var(--main-pad);
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .hint{
    color: var(--muted);
    text-align: center;
    padding: 60px 20px;
    line-height: 1.9;
    font-weight: 500;
    letter-spacing: .04em;
    transition: color var(--theme-fade) ease;
  }

  /* ===== 目錄列表 ===== */
  .dir-list{
    list-style: none; padding: 0; margin: 0;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(var(--grid-min), 1fr));
  }
  html.is-mobile .dir-list{gap: 10px;}
  .dir-list li{
    animation: slideIn .4s cubic-bezier(.22,.61,.36,1) both;
  }
  .dir-link{
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 20px 22px;
    background: linear-gradient(135deg, var(--bg-3) 0%, var(--bg-2) 100%);
    border: 1px solid var(--line-hi);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-card);
    color: var(--fg);
    text-decoration: none;
    font-weight: 700;
    letter-spacing: .04em;
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.06);
    transition:
      background-image var(--theme-fade) ease,
      border-color var(--theme-fade) ease,
      color var(--theme-fade) ease,
      transform .18s ease;
    position: relative;
    overflow: hidden;
  }
  .dir-link::after{
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 60px; height: 60px;
    background: repeating-linear-gradient(
      -45deg, transparent 0 4px, rgba(255,255,255,.06) 4px 8px);
    pointer-events: none;
  }
  html.is-mobile .dir-link{padding: 15px 16px;}
  .dir-link:hover{
    transform: translateX(3px);
    border-color: var(--accent);
    background: linear-gradient(135deg, var(--bg-3) 0%, var(--bg-3) 100%);
    box-shadow: var(--shadow), 0 0 24px var(--glow), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .dir-link > *{position: relative; z-index: 1;}
  .dir-name{word-break: break-all; font-size: 1rem;}
  html.is-mobile .dir-name{font-size: .92rem;}
  .dir-arrow{
    color: var(--accent);
    font-size: 1.5rem;
    line-height: 1;
    font-weight: 400;
    transition: all .18s ease;
  }
  .dir-link:hover .dir-arrow{
    color: var(--accent-hi);
    transform: translateX(4px);
    text-shadow: 0 0 12px var(--glow);
  }

  /* ===== 主檔名導航列 ===== */
  .thumbs{
    display: flex;
    gap: var(--thumb-gap);
    overflow-x: auto; overflow-y: hidden;
    padding: 2px 2px 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--line-hi) transparent;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  .thumbs::-webkit-scrollbar{height: 5px;}
  .thumbs::-webkit-scrollbar-track{background: transparent;}
  .thumbs::-webkit-scrollbar-thumb{background: var(--line-hi); border-radius: 0;}
  .thumbs::-webkit-scrollbar-thumb:hover{background: var(--accent);}
  html.is-mobile .thumbs{padding-bottom: 10px;}

  .thumb{
    flex: 0 0 auto;
    padding: var(--thumb-pad-y) var(--thumb-pad-x);
    border-radius: var(--radius-pill);
    background: var(--bg-2);
    color: var(--muted);
    border: 1px solid var(--line);
    font-family: inherit;
    font-size: var(--thumb-font);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    letter-spacing: .08em;
    line-height: 1.2;
    transition:
      background-color var(--theme-fade) ease,
      border-color var(--theme-fade) ease,
      color var(--theme-fade) ease,
      transform .15s ease;
  }
  html.is-mobile .thumb,
  html.is-tablet .thumb{ min-height: 34px; padding: 8px var(--thumb-pad-x); }
  .thumb:hover{
    color: var(--fg);
    border-color: var(--line-hi);
    background: var(--bg-3);
  }
  .thumb.active{
    background: var(--accent);
    border-color: var(--accent-hi);
    color: var(--accent-fg);
    font-weight: 800;
    box-shadow:
      0 0 16px var(--glow),
      0 0 32px var(--glow),
      inset 0 -2px 0 rgba(0,0,0,.15);
  }
  .thumb.is-video::after{
    content: '▶';
    font-size: .58em;
    margin-left: 5px;
    opacity: .75;
    vertical-align: 1px;
  }

  /* ===== 輪播 ===== */
  .carousel{
    position: relative;
    background: var(--bg-1);
    border-radius: var(--radius-card);
    overflow: hidden;
    user-select: none;
    touch-action: pan-y;
    box-shadow: var(--shadow-lg), 0 0 60px -20px var(--glow);
    border: 1px solid var(--line-hi);
    animation: slideIn .45s cubic-bezier(.22,.61,.36,1) both;
    cursor: grab;
    transition:
      background-color var(--theme-fade) ease,
      border-color var(--theme-fade) ease;
  }
  .carousel::before,
  .carousel::after{
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    border: 2px solid var(--accent);
    z-index: 3;
    pointer-events: none;
    opacity: .9;
    transition: border-color var(--theme-fade) ease;
  }
  .carousel::before{ top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
  .carousel::after { top: 8px; right: 8px; border-left: 0; border-bottom: 0; }
  .carousel:active{cursor: grabbing;}
  html.is-mobile .carousel{cursor: auto;}
  .track{display: flex; will-change: transform;}
  .slide{
    flex: 0 0 100%;
    height: var(--slide-h);
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(255,255,255,.04) 0%, transparent 70%),
      var(--bg-1);
    position: relative;
    transition: background-color var(--theme-fade) ease;
  }
  .slide::after{
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: linear-gradient(90deg,
      transparent 0%, var(--accent) 20%, var(--accent) 80%, transparent 100%);
    opacity: .7;
    pointer-events: none;
    transition: background var(--theme-fade) ease;
  }
  .slide img{
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
    pointer-events: none; -webkit-user-drag: none;
  }
  .slide video{
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
    background: #000;
    -webkit-user-drag: none;
    outline: none;
  }

  .nav{
    position: absolute; top: 50%; transform: translateY(-50%);
    width: var(--nav-size); height: var(--nav-size);
    border-radius: var(--radius-pill);
    border: 1px solid var(--line-hi);
    background: rgba(10,20,35,.85);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--fg);
    font-size: var(--nav-font); line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
    font-weight: 400;
    padding: 0 0 4px 0;
    z-index: 2;
    box-shadow: var(--shadow);
    transition:
      background-color .18s ease,
      border-color var(--theme-fade) ease,
      color var(--theme-fade) ease,
      transform .15s ease;
  }
  html.is-mobile .nav{opacity: .9; box-shadow: var(--shadow-sm);}
  .nav:hover{
    background: var(--accent);
    border-color: var(--accent-hi);
    color: var(--accent-fg);
    box-shadow: 0 0 24px var(--glow), 0 0 48px var(--glow), var(--shadow);
  }
  .nav:active{transform: translateY(-50%) scale(.94);}
  .nav:disabled{opacity: 0; pointer-events: none;}
  .nav.prev{left: var(--nav-offset);}
  .nav.next{right: var(--nav-offset);}

  .counter{
    position: absolute; right: 14px; bottom: 12px;
    background: rgba(10,20,35,.9);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--accent);
    font-size: var(--counter-font);
    font-weight: 800;
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    letter-spacing: .12em;
    z-index: 2; pointer-events: none;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--line-hi);
    box-shadow: var(--shadow-sm);
    text-shadow: 0 0 10px var(--glow);
    transition: color var(--theme-fade) ease, border-color var(--theme-fade) ease,
                text-shadow var(--theme-fade) ease;
  }
  html.is-mobile .counter{right: 8px; bottom: 8px; padding: 3px 9px;}

  /* ===== 說明 ===== */
  .caption{
    margin-top: 16px;
    padding: var(--cap-pad);
    background: linear-gradient(135deg, var(--bg-3) 0%, var(--bg-2) 100%);
    border: 1px solid var(--line-hi);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-card);
    font-size: var(--cap-font);
    line-height: 1.7;
    font-weight: 500;
    color: var(--fg);
    white-space: pre-wrap;
    word-break: break-word;
    min-height: var(--cap-min-h);
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.06);
    position: relative;
    animation: slideIn .45s .05s cubic-bezier(.22,.61,.36,1) both;
    transition:
      background-image var(--theme-fade) ease,
      border-color var(--theme-fade) ease,
      color var(--theme-fade) ease;
  }
  html.is-mobile .caption{margin-top: 12px;}
  .caption .num{
    display: inline-block;
    font-size: .72rem;
    background: var(--accent);
    color: var(--accent-fg);
    padding: 2px 9px;
    border-radius: var(--radius-pill);
    margin-right: 10px;
    font-variant-numeric: tabular-nums;
    vertical-align: middle;
    font-weight: 800;
    letter-spacing: .12em;
    box-shadow: 0 0 10px var(--glow);
    transition: background-color var(--theme-fade) ease, color var(--theme-fade) ease;
  }
  .caption .num.is-video::before{
    content: '▶ ';
    font-size: .85em;
  }
  .caption.empty{
    color: var(--muted);
    font-style: italic;
    font-weight: 400;
    border-left-color: var(--line-hi);
  }

  /* =========================================================
     燈箱（可縮放，保持原圖清晰度）
     ========================================================= */
  #lightbox{
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5,10,20,.92);
    -webkit-backdrop-filter: blur(20px) saturate(1.1);
    backdrop-filter: blur(20px) saturate(1.1);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; padding: 20px;
    cursor: default;
    animation: fadeIn .2s ease both;
    overscroll-behavior: contain;
  }
  html.is-mobile #lightbox{padding: 12px; gap: 10px;}
  #lightbox[hidden]{display: none;}

  /* 媒體舞台 */
  #lbBody{
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 120px;
    overflow: hidden;
    touch-action: none;
    border-radius: var(--radius-card);
    display: block;
  }

  /* 圖片 / 影片：絕對定位居中；圖片尺寸由 JS 以 width/height 控制
     → 不使用 transform:scale()，避免瀏覽器快取低解析度點陣圖造成模糊 */
  #lbBody img,
  #lbBody video{
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%;
    max-height: 100%;
    display: block;
    border-radius: var(--radius-card);
    border: 1px solid var(--line-hi);
    box-shadow:
      0 30px 90px -20px rgba(0,0,0,.7),
      0 0 80px var(--glow);
    background: #000;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #lbBody img{
    image-rendering: auto;
    cursor: zoom-in;
  }
  #lbBody img.zoomed{ cursor: grab; }
  #lbBody img.grabbing{ cursor: grabbing; }
  #lbBody video{
    max-width: 100%; max-height: 100%;
    outline: none;
  }

  /* 縮放工具列 */
  #lbTools{
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: rgba(15,25,45,.85);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line-hi);
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow-sm);
    animation: fadeIn .2s ease both;
    flex: 0 0 auto;
  }
  #lbTools[hidden]{ display: none; }
  #lbTools button{
    background: var(--bg-2);
    color: var(--fg);
    border: 1px solid var(--line-hi);
    border-radius: var(--radius-pill);
    min-width: 34px;
    height: 30px;
    padding: 0 10px;
    font-family: inherit;
    font-size: .85rem;
    font-weight: 800;
    letter-spacing: .04em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  #lbTools button:hover{
    background: var(--bg-3);
    border-color: var(--accent);
    color: var(--accent-hi);
    box-shadow: 0 0 12px var(--glow);
  }
  #lbTools button:active{ transform: translateY(1px); }
  #zoomVal{
    min-width: 54px;
    text-align: center;
    font-size: .78rem;
    font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: .06em;
    text-shadow: 0 0 10px var(--glow);
  }
  html.is-mobile #lbTools{ padding: 5px 8px; gap: 5px; }
  html.is-mobile #lbTools button{ min-width: 30px; height: 27px; font-size: .8rem; padding: 0 8px; }
  html.is-mobile #zoomVal{ min-width: 46px; font-size: .72rem; }

  #lightbox p{
    margin: 0;
    color: var(--fg);
    text-align: center;
    max-width: 820px;
    line-height: 1.7;
    font-weight: 500;
    padding: 12px 20px;
    background: rgba(15,25,45,.85);
    border: 1px solid var(--line-hi);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-card);
    flex: 0 0 auto;
    max-height: 22vh;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  html.is-mobile #lightbox p{font-size: .88rem; padding: 10px 14px;}
  #lightbox p[hidden]{display: none;}

  /* ===== 動畫 ===== */
  @keyframes slideIn{
    from{opacity: 0; transform: translateX(-8px);}
    to  {opacity: 1; transform: translateX(0);}
  }
  @keyframes fadeIn{
    from{opacity: 0;}
    to  {opacity: 1;}
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
    #themeBtn .dot{ animation: none; }
  }
</style>
</head>
<body>

<div id="bg" aria-hidden="true">
  <div class="bg-pane active" data-theme="steel"></div>
  <div class="bg-pane"        data-theme="forge"></div>
  <div class="bg-pane"        data-theme="jungle"></div>
  <div class="bg-pane"        data-theme="midnight"></div>
  <div class="bg-pane"        data-theme="carbon"></div>
</div>

<header>
  <button id="back" class="btn" hidden>← 回目錄</button>
  <h1 id="title">台電受訓</h1>
  <button id="themeBtn" type="button" title="點擊切換主題，雙擊暫停 / 繼續自動切換">
    <span class="dot"></span>
    <span class="txt">STEEL</span>
    <span class="pause">⏸</span>
  </button>
</header>

<main id="view"></main>

<div id="lightbox" hidden>
  <div id="lbBody"></div>
  <div id="lbTools" hidden>
    <button type="button" data-act="out" aria-label="縮小" title="縮小（-）">−</button>
    <span id="zoomVal">100%</span>
    <button type="button" data-act="in" aria-label="放大" title="放大（+）">+</button>
    <button type="button" data-act="reset" aria-label="重置縮放" title="重置（0）">重置</button>
  </div>
  <p id="lbCap"></p>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     0. 光暈元素建立
     ========================================================= */
  const ORB_COUNT = 4;
  document.querySelectorAll('.bg-pane').forEach(pane => {
    for (let i = 0; i < ORB_COUNT; i++) {
      const orb = document.createElement('span');
      orb.className = 'orb';
      pane.appendChild(orb);
    }
  });

  function randomizeOrbs(pane) {
    const orbs = pane.querySelectorAll('.orb');
    const N = orbs.length;
    for (let i = 0; i < N; i++) {
      const orb = orbs[i];
      const range = 35 + i * 7;
      const x = (Math.random() * 2 - 1) * range;
      const y = (Math.random() * 2 - 1) * range * 0.85;
      orb.style.setProperty('--ox', x.toFixed(2) + 'vw');
      orb.style.setProperty('--oy', y.toFixed(2) + 'vh');
    }
  }

  /* =========================================================
     1. 主題系統
     ========================================================= */
  const THEMES = [
    { id: 'steel',    label: 'STEEL'    },
    { id: 'forge',    label: 'FORGE'    },
    { id: 'jungle',   label: 'JUNGLE'   },
    { id: 'midnight', label: 'MIDNIGHT' },
    { id: 'carbon',   label: 'CARBON'   },
  ];
  const THEME_INTERVAL = 3000;

  const themeSystem = (() => {
    const htmlEl  = document.documentElement;
    const panes   = Array.from(document.querySelectorAll('.bg-pane'));
    const btn     = document.getElementById('themeBtn');
    const btnTxt  = btn.querySelector('.txt');
    const btnIco  = btn.querySelector('.pause');

    let current   = 0;
    let autoTimer = null;
    let paused    = false;
    let reduced   = window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function apply(i) {
      i = ((i % THEMES.length) + THEMES.length) % THEMES.length;
      current = i;
      const theme = THEMES[i];

      htmlEl.setAttribute('data-theme', theme.id);

      panes.forEach(p => {
        if (p.dataset.theme === theme.id) p.classList.add('active');
        else                              p.classList.remove('active');
      });

      const activePane = panes.find(p => p.dataset.theme === theme.id);
      if (activePane) randomizeOrbs(activePane);

      btnTxt.textContent = theme.label;
    }

    function next() { apply(current + 1); }

    function startAuto() {
      stopAuto();
      if (reduced || paused) return;
      autoTimer = setInterval(next, THEME_INTERVAL);
    }
    function stopAuto() {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    }
    function resetAuto() { if (!paused && !reduced) startAuto(); }

    function setPaused(p) {
      paused = p;
      btnIco.textContent = p ? '▶' : '⏸';
      btn.title = p
        ? '已暫停自動切換（雙擊恢復）'
        : '點擊切換主題，雙擊暫停 / 繼續自動切換';
      if (p) stopAuto();
      else   startAuto();
    }

    let clickTimer = null;
    btn.addEventListener('click', () => {
      if (clickTimer) {
        clearTimeout(clickTimer);
        clickTimer = null;
        setPaused(!paused);
        return;
      }
      clickTimer = setTimeout(() => {
        clickTimer = null;
        next();
        resetAuto();
      }, 220);
    });

    panes.forEach(randomizeOrbs);
    apply(0);
    startAuto();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') resetAuto();
    });

    return { apply, next, setPaused, startAuto, stopAuto };
  })();

  /* =========================================================
     2. 裝置偵測
     ========================================================= */
  const device = {
    current: null,
    detect() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const shortSide = Math.min(w, h);
      const ua = navigator.userAgent || '';
      const isMobileUA = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
      const isTabletUA = /iPad|Tablet|PlayBook|Silk/i.test(ua) ||
                         (isMobileUA && !/Mobile/i.test(ua));
      const isTouch = ('ontouchstart' in window) ||
                      (navigator.maxTouchPoints > 0) ||
                      (window.matchMedia && matchMedia('(hover: none)').matches);
      if (shortSide < 600 || (isMobileUA && shortSide < 768)) return 'mobile';
      if (shortSide < 1024 || isTabletUA || (isTouch && shortSide < 1200)) return 'tablet';
      return 'desktop';
    },
    apply(force) {
      const type = this.detect();
      if (!force && type === this.current) return;
      this.current = type;
      const el = document.documentElement;
      el.dataset.device = type;
      el.classList.remove('is-mobile', 'is-tablet', 'is-desktop');
      el.classList.add('is-' + type);
    }
  };
  device.apply(true);

  let resizeTimer = null;
  function onResizeDebounced(delay) {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => device.apply(), delay || 120);
  }
  window.addEventListener('resize', () => onResizeDebounced(120));
  window.addEventListener('orientationchange', () => onResizeDebounced(250));

  /* =========================================================
     設定區
     ========================================================= */
  const MANUAL_DIRS = [
    // 'test1',
  ];
  const DIRS_FILE = './dirs.txt';

  const MEDIA_EXTS = ['jpg', 'png', 'mp4'];
  const VIDEO_EXTS = new Set(['mp4', 'webm', 'mov', 'm4v']);

  const MAX_SCAN   = 1000;
  const SCAN_BATCH = 16;
  const LOAD_BATCH = 16;
  const MISS_LIMIT = 6;

  /* =========================================================
     小工具
     ========================================================= */
  const $ = s => document.querySelector(s);
  const view     = $('#view');
  const titleEl  = $('#title');
  const backBtn  = $('#back');
  const lightbox = $('#lightbox');
  const lbBody   = $('#lbBody');
  const lbTools  = $('#lbTools');
  const zoomValEl= $('#zoomVal');
  const lbCap    = $('#lbCap');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const pad3     = n => String(n).padStart(3, '0');
  const mediaURL = (dir, num, ext) => `${dir}/${num}.${ext}`;
  const isVideoExt = ext => VIDEO_EXTS.has(String(ext).toLowerCase());
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

  let pageAbort = null;

  /* =========================================================
     3. 找出所有子目錄
     ========================================================= */
  async function discoverDirs() {
    const ordered = [];
    const seen    = new Set();

    const addUnique = (name) => {
      if (!name) return;
      if (name.includes('/') || name.startsWith('.')) return;
      if (seen.has(name)) return;
      seen.add(name);
      ordered.push(name);
    };

    const listText = await fetchTextSmart(DIRS_FILE);
    if (listText) {
      listText.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
        const s = line.trim();
        if (!s || s.startsWith('#')) return;
        const name = s.replace(/\/+$/, '');
        addUnique(name);
      });
    }

    MANUAL_DIRS.forEach(addUnique);

    const autoFound = [];
    try {
      const res = await fetch('./', { cache: 'no-store' });
      if (res.ok) {
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        if (!doc.querySelector('meta[name="app"]')) {
          const base = new URL('./', location.href);
          doc.querySelectorAll('a[href]').forEach(a => {
            let u;
            try { u = new URL(a.getAttribute('href'), base); } catch (_) { return; }
            if (u.origin !== base.origin) return;
            if (!u.pathname.startsWith(base.pathname)) return;
            if (!u.pathname.endsWith('/')) return;
            let rel;
            try { rel = decodeURIComponent(u.pathname.slice(base.pathname.length)); }
            catch (_) { return; }
            if (!rel.endsWith('/')) return;
            const name = rel.slice(0, -1);
            if (!name || name.includes('/') || name.startsWith('.')) return;
            if (!seen.has(name)) autoFound.push(name);
          });
        }
      }
    } catch (_) {}

    autoFound.sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    autoFound.forEach(addUnique);

    return ordered;
  }

  /* =========================================================
     4. 讀文字檔
     ========================================================= */
  async function fetchTextSmart(url) {
    let res;
    try { res = await fetch(url, { cache: 'no-store' }); }
    catch (_) { return null; }
    if (!res.ok) return null;

    const buf = await res.arrayBuffer();
    if (!buf.byteLength) return '';

    const b = new Uint8Array(buf);
    if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF)
      return new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/, '');
    if (b[0] === 0xFF && b[1] === 0xFE) {
      try { return new TextDecoder('utf-16le').decode(buf).replace(/^\uFEFF/, ''); } catch (_) {}
    }
    if (b[0] === 0xFE && b[1] === 0xFF) {
      try { return new TextDecoder('utf-16be').decode(buf).replace(/^\uFEFF/, ''); } catch (_) {}
    }

    let text = new TextDecoder('utf-8').decode(buf);
    if (!text.includes('\uFFFD')) return text.replace(/^\uFEFF/, '');

    for (const enc of ['big5', 'big5-hkscs', 'ms950', 'gbk', 'gb18030']) {
      try {
        const t = new TextDecoder(enc).decode(buf);
        if (t && !t.includes('\uFFFD')) return t.replace(/^\uFEFF/, '');
      } catch (_) {}
    }
    return text;
  }

  /* =========================================================
     5. 解析 content.txt
     ========================================================= */
  function parseContent(text) {
    const map = new Map();
    text.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
      const s = line.trim();
      if (!s) return;
      const m = s.match(/^(\d+)(?:\s+([\s\S]*))?$/);
      if (!m) return;
      map.set(pad3(m[1]), (m[2] || '').trim());
    });
    return map;
  }

  /* =========================================================
     6. 媒體載入
     ========================================================= */
  function loadMedia(dir, num) {
    return new Promise(resolve => {
      let i = 0;

      const tryNext = () => {
        if (i >= MEDIA_EXTS.length) { resolve(null); return; }
        const ext = MEDIA_EXTS[i++];
        const url = mediaURL(dir, num, ext);

        if (isVideoExt(ext)) {
          const v = document.createElement('video');
          v.preload     = 'metadata';
          v.controls    = true;
          v.playsInline = true;
          v.setAttribute('playsinline', '');
          v.setAttribute('webkit-playsinline', '');

          const ok = () => {
            v.removeEventListener('loadedmetadata', ok);
            v.removeEventListener('error', fail);
            resolve({ num, type: 'video', el: v, src: url });
          };
          const fail = () => {
            v.removeEventListener('loadedmetadata', ok);
            v.removeEventListener('error', fail);
            try { v.removeAttribute('src'); v.load(); } catch (_) {}
            tryNext();
          };

          v.addEventListener('loadedmetadata', ok);
          v.addEventListener('error', fail);
          v.src = url;
        } else {
          const img = new Image();
          img.decoding = 'async';
          img.onload  = () => { img.onerror = null; resolve({ num, type: 'img', el: img, src: url }); };
          img.onerror = () => tryNext();
          img.src = url;
        }
      };

      tryNext();
    });
  }

  async function loadList(dir, nums) {
    const out = [];
    for (let i = 0; i < nums.length; i += LOAD_BATCH) {
      const batch = nums.slice(i, i + LOAD_BATCH);
      const res = await Promise.all(batch.map(n => loadMedia(dir, n)));
      for (let k = 0; k < res.length; k++) {
        if (res[k]) out.push(res[k]);
      }
    }
    return out;
  }

  async function scanItems(dir) {
    const out = [];
    let misses = 0;
    for (let i = 0; i < MAX_SCAN && misses < MISS_LIMIT; i += SCAN_BATCH) {
      const batch = [];
      for (let k = 0; k < SCAN_BATCH && i + k < MAX_SCAN; k++) batch.push(pad3(i + k));
      const res = await Promise.all(batch.map(n => loadMedia(dir, n)));
      for (let k = 0; k < res.length; k++) {
        if (res[k]) { out.push(res[k]); misses = 0; }
        else misses++;
      }
    }
    return out;
  }

  /* =========================================================
     7. 燈箱 + 高清縮放系統

     關鍵：圖片放大「不使用 CSS transform: scale()」，
     而是直接改變 <img> 的 width / height（以原始像素為上限），
     讓瀏覽器以真正的像素尺寸重新繪製，維持銳利度。
     transform 只用於「平移」定位。
     ========================================================= */
  const zoom = { scale: 1, tx: 0, ty: 0, MIN: 1, MAX: 12 };

  let lbImgEl    = null;                     // 目前燈箱中的 <img>
  let lbReady    = false;                    // 圖片已載入且尺寸已計算
  let lbBase     = { w: 1, h: 1 };           // scale = 1 時的基準顯示尺寸 (CSS px)

  const pointers   = new Map();
  let dragState    = null;
  let pinchState   = null;
  let pressTarget  = null;
  let pressMoved   = false;
  let pressStartX  = 0;
  let pressStartY  = 0;
  let lastTapTime  = 0;
  let lastTapX     = 0;
  let lastTapY     = 0;

  function currentLbImg() {
    return (lbImgEl && lbReady) ? lbImgEl : null;
  }

  function updateZoomUI() {
    if (zoomValEl) zoomValEl.textContent = Math.round(zoom.scale * 100) + '%';
  }

  /* 計算 scale = 1 時的基準尺寸（符合容器，且不超過原圖） */
  function computeBase() {
    const img = lbImgEl;
    if (!img || !img.naturalWidth) return;

    const cw = lbBody.clientWidth  || window.innerWidth;
    const ch = lbBody.clientHeight || window.innerHeight;
    const nw = img.naturalWidth;
    const nh = img.naturalHeight;

    /* 不放大超過原圖（避免小圖被硬撐模糊）；也不超過容器 */
    const s = Math.min(cw / nw, ch / nh, 1);
    lbBase.w = Math.max(1, nw * s);
    lbBase.h = Math.max(1, nh * s);
  }

  /* 套用目前縮放 / 平移狀態 */
  function applyZoom(animate) {
    const img = lbImgEl;
    if (!img || !lbReady) { updateZoomUI(); return; }

    zoom.scale = clamp(zoom.scale, zoom.MIN, zoom.MAX);
    if (zoom.scale <= 1.0001) {
      zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    }

    img.style.transition = animate
      ? 'width .22s cubic-bezier(.22,.61,.36,1), height .22s cubic-bezier(.22,.61,.36,1), transform .22s cubic-bezier(.22,.61,.36,1)'
      : 'none';

    /* 以 width / height 真正改變像素尺寸 → 瀏覽器重繪為清晰影像 */
    const w = Math.round(lbBase.w * zoom.scale);
    const h = Math.round(lbBase.h * zoom.scale);
    img.style.width     = w + 'px';
    img.style.height    = h + 'px';
    img.style.maxWidth  = 'none';
    img.style.maxHeight = 'none';

    /* transform 僅負責平移定位（不縮放點陣圖） */
    img.style.transform =
      `translate(-50%, -50%) translate(${zoom.tx.toFixed(2)}px, ${zoom.ty.toFixed(2)}px)`;

    img.classList.toggle('zoomed', zoom.scale > 1.001);
    updateZoomUI();
  }

  /* 以 (ax, ay) 螢幕座標為錨點縮放到 newScale */
  function zoomTo(newScale, ax, ay, animate) {
    const img = currentLbImg();
    if (!img) return;

    newScale = clamp(newScale, zoom.MIN, zoom.MAX);
    if (Math.abs(newScale - zoom.scale) < 0.0005) return;

    const r   = lbBody.getBoundingClientRect();
    const ccX = r.left + r.width  / 2;
    const ccY = r.top  + r.height / 2;
    const k   = newScale / zoom.scale;

    zoom.tx = (ax - ccX) - (ax - ccX - zoom.tx) * k;
    zoom.ty = (ay - ccY) - (ay - ccY - zoom.ty) * k;
    zoom.scale = newScale;

    applyZoom(animate);
  }

  function resetZoom(animate) {
    if (!lbImgEl) return;
    zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    applyZoom(animate);
  }

  /* ---- 開 / 關燈箱 ---- */
  function openLightbox(item) {
    lbBody.innerHTML = '';
    lbCap.textContent = '';
    lbImgEl = null;
    lbReady = false;
    zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    pointers.clear();
    dragState = null; pinchState = null;
    pressTarget = null; pressMoved = false;
    lastTapTime = 0;

    if (item.type === 'video') {
      const v = document.createElement('video');
      v.src          = item.src;
      v.controls     = true;
      v.playsInline  = true;
      v.autoplay     = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      lbBody.appendChild(v);
      lbTools.hidden = true;
      const p = v.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } else {
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.cap || item.num;
      img.draggable = false;
      img.style.opacity = '0';
      lbBody.appendChild(img);
      lbImgEl = img;
      lbTools.hidden = false;

      const init = () => {
        if (!lbImgEl || lbImgEl !== img) return;
        lbReady = true;
        computeBase();
        zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
        applyZoom(false);
        img.style.opacity = '';
      };

      if (img.complete && img.naturalWidth) init();
      else img.addEventListener('load', init, { once: true });
    }

    lbCap.textContent = item.cap || '';
    lbCap.hidden = !item.cap;
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lbBody.querySelectorAll('video').forEach(v => {
      try { v.pause(); } catch (_) {}
    });
    lbBody.innerHTML = '';
    lbCap.textContent = '';
    lbCap.hidden = true;
    lightbox.hidden = true;
    document.body.style.overflow = '';

    lbImgEl = null;
    lbReady = false;
    zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    pointers.clear();
    dragState = null; pinchState = null;
    pressTarget = null; pressMoved = false;
    lbTools.hidden = true;
  }

  /* ---- 指標事件 ---- */
  lightbox.addEventListener('pointerdown', e => {
    pressTarget = e.target;
    pressMoved  = false;
    pressStartX = e.clientX;
    pressStartY = e.clientY;

    if (e.pointerType === 'mouse' && e.button !== 0) return;

    const img = currentLbImg();
    if (!img || e.target !== img) return;

    e.preventDefault();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { lightbox.setPointerCapture(e.pointerId); } catch (_) {}

    if (pointers.size === 1) {
      dragState = { x: e.clientX, y: e.clientY, tx: zoom.tx, ty: zoom.ty };
      img.classList.add('grabbing');
      img.classList.remove('zoomed');
    } else if (pointers.size === 2) {
      const pts = [...pointers.values()];
      const r   = lbBody.getBoundingClientRect();
      pinchState = {
        dist:  Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1,
        cx:    (pts[0].x + pts[1].x) / 2,
        cy:    (pts[0].y + pts[1].y) / 2,
        scale: zoom.scale,
        tx:    zoom.tx,
        ty:    zoom.ty,
        ccX:   r.left + r.width  / 2,
        ccY:   r.top  + r.height / 2
      };
      dragState = null;
      img.classList.remove('grabbing');
    }
  });

  lightbox.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    pressMoved = true;

    const img = currentLbImg();
    if (!img) return;

    /* 雙指縮放 */
    if (pointers.size >= 2 && pinchState) {
      const pts  = [...pointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
      const cx   = (pts[0].x + pts[1].x) / 2;
      const cy   = (pts[0].y + pts[1].y) / 2;

      const newScale = clamp(pinchState.scale * (dist / pinchState.dist),
                             zoom.MIN, zoom.MAX);
      const k  = newScale / pinchState.scale;
      const dx = cx - pinchState.cx;
      const dy = cy - pinchState.cy;

      zoom.tx = (pinchState.cx - pinchState.ccX)
                - (pinchState.cx - pinchState.ccX - pinchState.tx) * k + dx;
      zoom.ty = (pinchState.cy - pinchState.ccY)
                - (pinchState.cy - pinchState.ccY - pinchState.ty) * k + dy;
      zoom.scale = newScale;

      applyZoom(false);
      if (e.cancelable) e.preventDefault();
      return;
    }

    /* 單指 / 滑鼠拖曳平移 */
    if (dragState && zoom.scale > 1.001) {
      zoom.tx = dragState.tx + (e.clientX - dragState.x);
      zoom.ty = dragState.ty + (e.clientY - dragState.y);
      applyZoom(false);
      if (e.cancelable) e.preventDefault();
    }
  });

  function endPointer(e) {
    if (pointers.has(e.pointerId)) pointers.delete(e.pointerId);
    try { lightbox.releasePointerCapture(e.pointerId); } catch (_) {}

    const img = currentLbImg();

    if (pointers.size < 2) pinchState = null;

    if (pointers.size === 1) {
      const p = [...pointers.values()][0];
      dragState = { x: p.x, y: p.y, tx: zoom.tx, ty: zoom.ty };
      if (img) img.classList.add('grabbing');
    } else if (pointers.size === 0) {
      dragState = null;
      if (img) {
        img.classList.remove('grabbing');
        img.classList.toggle('zoomed', zoom.scale > 1.001);
      }
    }
  }

  lightbox.addEventListener('pointerup', e => {
    const wasPress = pressTarget;
    const wasMoved = pressMoved;
    const img      = currentLbImg();
    const wasImg   = img && wasPress === img;
    const pCount   = pointers.size;

    const bgDist = Math.hypot(e.clientX - pressStartX, e.clientY - pressStartY);
    const bgMoved = bgDist > 8;

    endPointer(e);

    /* 點擊背景（且幾乎沒移動）→ 關閉燈箱 */
    if (!wasImg && !wasMoved && !bgMoved &&
        (wasPress === lightbox || wasPress === lbBody)) {
      pressTarget = null; pressMoved = false;
      closeLightbox();
      return;
    }

    /* 圖片：偵測雙擊（單擊不做事，避免誤觸） */
    if (!wasMoved && wasImg && pCount <= 1) {
      const now = performance.now();
      if (now - lastTapTime < 320 &&
          Math.abs(e.clientX - lastTapX) < 40 &&
          Math.abs(e.clientY - lastTapY) < 40) {
        lastTapTime = 0;
        if (zoom.scale > 1.05) resetZoom(true);
        else                   zoomTo(2.5, e.clientX, e.clientY, true);
      } else {
        lastTapTime = now;
        lastTapX = e.clientX;
        lastTapY = e.clientY;
      }
    }

    pressTarget = null;
    pressMoved  = false;
  });

  lightbox.addEventListener('pointercancel', e => {
    endPointer(e);
    pressTarget = null;
    pressMoved  = false;
  });

  /* ---- 滾輪縮放 ---- */
  lightbox.addEventListener('wheel', e => {
    const img = currentLbImg();
    if (!img) return;
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0018);
    zoomTo(zoom.scale * factor, e.clientX, e.clientY, false);
  }, { passive: false });

  /* ---- 工具列 ---- */
  lbTools.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    e.stopPropagation();

    const img = currentLbImg();
    if (!img) return;

    const rect = lbBody.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;

    const act = btn.dataset.act;
    if (act === 'in')    zoomTo(zoom.scale * 1.4, cx, cy, true);
    if (act === 'out')   zoomTo(zoom.scale / 1.4, cx, cy, true);
    if (act === 'reset') resetZoom(true);
  });

  /* ---- 鍵盤 ---- */
  document.addEventListener('keydown', e => {
    if (lightbox.hidden) return;
    if (e.key === 'Escape') { closeLightbox(); return; }

    const img = currentLbImg();
    if (!img) return;

    const rect = lbBody.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;

    if (e.key === '+' || e.key === '=') {
      zoomTo(zoom.scale * 1.35, cx, cy, true); e.preventDefault();
    } else if (e.key === '-' || e.key === '_') {
      zoomTo(zoom.scale / 1.35, cx, cy, true); e.preventDefault();
    } else if (e.key === '0') {
      resetZoom(true); e.preventDefault();
    }
  });

  /* ---- 視窗尺寸變化：重算基準尺寸 ---- */
  let lbResizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(lbResizeTimer);
    lbResizeTimer = setTimeout(() => {
      if (lightbox.hidden || !lbImgEl || !lbReady) return;
      computeBase();
      if (zoom.scale > 1.001) {
        resetZoom(false);       // 重新適應新容器
      } else {
        applyZoom(false);
      }
    }, 140);
  });

  /* =========================================================
     8. 目錄列表
     ========================================================= */
  async function renderIndex() {
    if (pageAbort) { pageAbort.abort(); pageAbort = null; }
    backBtn.hidden = true;
    titleEl.textContent = '台電受訓';
    document.title = '台電受訓';
    view.innerHTML = '';
    view.appendChild(el('p', 'hint', '讀取目錄中…'));

    const dirs = await discoverDirs();
    view.innerHTML = '';

    if (!dirs.length) {
      const p = el('p', 'hint');
      p.appendChild(document.createTextNode('找不到任何子目錄。'));
      p.appendChild(document.createElement('br'));
      p.appendChild(document.createTextNode(
        '請在根目錄建立 dirs.txt（一行一個目錄名稱），或在 index.html 的 MANUAL_DIRS 陣列中手動填入。'
      ));
      view.appendChild(p);
      return;
    }

    const ul = el('ul', 'dir-list');
    dirs.forEach((d, i) => {
      const li = el('li');
      li.style.animationDelay = Math.min(i * 35, 400) + 'ms';
      const a = el('a', 'dir-link');
      a.href = '#/' + encodeURIComponent(d);
      a.appendChild(el('span', 'dir-name', d));
      a.appendChild(el('span', 'dir-arrow', '›'));
      li.appendChild(a);
      ul.appendChild(li);
    });
    view.appendChild(ul);
  }

  /* =========================================================
     9. 相簿內容
     ========================================================= */
  async function renderGallery(dir) {
    if (pageAbort) pageAbort.abort();
    pageAbort = new AbortController();
    const signal = pageAbort.signal;

    backBtn.hidden = false;
    titleEl.textContent = dir;
    document.title = dir + ' — 台電受訓';
    view.innerHTML = '';
    view.appendChild(el('p', 'hint', '載入中…'));

    const txt = await fetchTextSmart(dir + '/content.txt');
    const map = txt ? parseContent(txt) : null;

    let items, hasList = false;
    if (map && map.size) {
      hasList = true;
      const nums = [...map.keys()].sort((a, b) =>
        a.localeCompare(b, undefined, { numeric: true })
      );
      items = await loadList(dir, nums);
      items.forEach(it => { it.cap = map.get(it.num) || ''; });
    } else {
      items = await scanItems(dir);
      items.forEach(it => { it.cap = ''; });
    }

    if (!items.length) {
      view.innerHTML = '';
      view.appendChild(el('p', 'hint',
        hasList ? '清單中的編號都找不到對應圖片 / 影片。'
                : '這個目錄裡找不到圖片或影片。'));
      return;
    }

    view.innerHTML = '';

    const thumbs = el('div', 'thumbs');
    const thumbBtns = items.map((it, i) => {
      const b = el('button', 'thumb', it.num);
      b.type = 'button';
      if (it.type === 'video') b.classList.add('is-video');
      b.title = it.cap ? (it.num + ' — ' + it.cap) : it.num;
      b.setAttribute('aria-label', '跳到 ' + it.num);
      b.addEventListener('click', () => goTo(i));
      thumbs.appendChild(b);
      return b;
    });

    const carousel = el('div', 'carousel');
    const track    = el('div', 'track');

    items.forEach(it => {
      const slide = el('div', 'slide');
      slide.appendChild(it.el);
      track.appendChild(slide);
    });
    carousel.appendChild(track);

    const prevBtn = el('button', 'nav prev');
    prevBtn.type = 'button';
    prevBtn.setAttribute('aria-label', '上一張');
    prevBtn.textContent = '‹';

    const nextBtn = el('button', 'nav next');
    nextBtn.type = 'button';
    nextBtn.setAttribute('aria-label', '下一張');
    nextBtn.textContent = '›';

    const counter = el('div', 'counter');

    carousel.appendChild(prevBtn);
    carousel.appendChild(nextBtn);
    carousel.appendChild(counter);

    const capBox = el('div', 'caption');

    view.appendChild(thumbs);
    view.appendChild(carousel);
    view.appendChild(capBox);

    let idx = 0;
    const total = items.length;
    let activeThumb = -1;

    function goTo(i, animate) {
      if (animate === undefined) animate = true;
      idx = Math.max(0, Math.min(total - 1, i));

      track.style.transition = animate
        ? 'transform .3s cubic-bezier(.22,.61,.36,1)'
        : 'none';
      track.style.transform = `translateX(${-idx * 100}%)`;

      counter.textContent = pad3(idx + 1) + ' / ' + pad3(total);
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx >= total - 1;

      items.forEach((it, k) => {
        if (k !== idx && it.type === 'video') {
          try { it.el.pause(); } catch (_) {}
        }
      });

      if (activeThumb !== idx) {
        if (thumbBtns[activeThumb]) thumbBtns[activeThumb].classList.remove('active');
        const t = thumbBtns[idx];
        if (t) {
          t.classList.add('active');
          try {
            t.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
          } catch (_) { t.scrollIntoView(false); }
        }
        activeThumb = idx;
      }

      const it = items[idx];
      capBox.innerHTML = '';
      const numTag = el('span', 'num', it.num);
      if (it.type === 'video') numTag.classList.add('is-video');
      capBox.appendChild(numTag);

      if (it.cap) {
        capBox.classList.remove('empty');
        capBox.appendChild(document.createTextNode(it.cap));
      } else {
        capBox.classList.add('empty');
        capBox.appendChild(document.createTextNode(
          it.type === 'video' ? '（影片，無說明）' : '（無說明）'
        ));
      }
    }

    prevBtn.addEventListener('click', () => goTo(idx - 1));
    nextBtn.addEventListener('click', () => goTo(idx + 1));

    let down = false, dragging = false;
    let startX = 0, startY = 0;
    let activePointer = null;

    function onDown(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest('video')) return;

      down = true;
      dragging = false;
      activePointer = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      track.style.transition = 'none';
    }

    function onMove(e) {
      if (!down || e.pointerId !== activePointer) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (!dragging) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        if (Math.abs(dy) > Math.abs(dx)) {
          down = false;
          activePointer = null;
          goTo(idx);
          return;
        }
        dragging = true;
      }

      if (e.cancelable) e.preventDefault();

      const w = carousel.offsetWidth || 1;
      const pct = (-idx * 100) + (dx / w) * 100;
      track.style.transform = `translateX(${pct}%)`;
    }

    function onUp(e) {
      if (!down) return;
      if (activePointer !== null && e.pointerId !== activePointer) return;

      const wasDragging = dragging;
      const dx = e.clientX - startX;
      down = false;
      dragging = false;
      activePointer = null;

      if (wasDragging) {
        const threshold = Math.max(50, carousel.offsetWidth * 0.15);
        if (dx < -threshold)     goTo(idx + 1);
        else if (dx > threshold) goTo(idx - 1);
        else                     goTo(idx);
      } else {
        openLightbox(items[idx]);
      }
    }

    track.addEventListener('pointerdown', onDown, { signal });
    document.addEventListener('pointermove', onMove, { passive: false, signal });
    document.addEventListener('pointerup', onUp, { signal });
    document.addEventListener('pointercancel', onUp, { signal });

    if (device.current === 'desktop') {
      document.addEventListener('keydown', e => {
        if (!lightbox.hidden) return;
        if (e.key === 'ArrowLeft')  { goTo(idx - 1); e.preventDefault(); }
        if (e.key === 'ArrowRight') { goTo(idx + 1); e.preventDefault(); }
      }, { signal });
    }

    goTo(0, false);
  }

  /* =========================================================
     10. 路由
     ========================================================= */
  function currentDir() {
    const h = location.hash.replace(/^#\/?/, '');
    if (!h) return null;
    try { return decodeURIComponent(h); } catch (_) { return h; }
  }

  async function render() {
    window.scrollTo(0, 0);
    const dir = currentDir();
    if (dir) await renderGallery(dir);
    else await renderIndex();
  }

  backBtn.addEventListener('click', () => { location.hash = '#/'; });
  window.addEventListener('hashchange', render);

  render();
})();
</script>
</body>
</html>
