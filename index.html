<!DOCTYPE html>
<html lang="zh-Hant" data-theme="steel">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app" content="gallery-index">
<title>台電受訓</title>
<style>
  /* =========================================================
     主題配色（5 種工業風，加強明暗對比）
     ========================================================= */
  html[data-theme="steel"]{
    --bg-0:#02050a; --bg-1:#050a14; --bg-2:#0a1322; --bg-3:#14233d;
    --line:#1a2a45; --line-hi:#345180;
    --fg:#f0f6ff; --muted:#8fa5c2;
    --accent:#5eb8ff; --accent-hi:#9bd4ff; --accent-fg:#020a14;
    --glow:rgba(94,184,255,.7);
  }
  html[data-theme="forge"]{
    --bg-0:#0a0202; --bg-1:#150604; --bg-2:#220a06; --bg-3:#3a1408;
    --line:#3d1a0e; --line-hi:#6b2e15;
    --fg:#fff2e8; --muted:#c29877;
    --accent:#ff6b1a; --accent-hi:#ffa057; --accent-fg:#140400;
    --glow:rgba(255,107,26,.7);
  }
  html[data-theme="jungle"]{
    --bg-0:#020703; --bg-1:#051008; --bg-2:#0a1c0f; --bg-3:#123a1e;
    --line:#163620; --line-hi:#256b3a;
    --fg:#e8fff0; --muted:#7fb394;
    --accent:#4dff8a; --accent-hi:#96ffc0; --accent-fg:#021a08;
    --glow:rgba(77,255,138,.7);
  }
  html[data-theme="midnight"]{
    --bg-0:#05020f; --bg-1:#0b0520; --bg-2:#150a35; --bg-3:#261458;
    --line:#2a1866; --line-hi:#4b2ea8;
    --fg:#f2eaff; --muted:#a395c7;
    --accent:#b570ff; --accent-hi:#d4a6ff; --accent-fg:#0e0322;
    --glow:rgba(181,112,255,.7);
  }
  html[data-theme="carbon"]{
    --bg-0:#000000; --bg-1:#0a0a0a; --bg-2:#141414; --bg-3:#242424;
    --line:#2a2a2a; --line-hi:#4a4a4a;
    --fg:#ffffff; --muted:#9a9a9a;
    --accent:#ffffff; --accent-hi:#ffffff; --accent-fg:#000000;
    --glow:rgba(255,255,255,.55);
  }

  :root{
    --shadow-sm: 0 2px 8px rgba(0,0,0,.7);
    --shadow:    0 8px 28px rgba(0,0,0,.75);
    --shadow-lg: 0 18px 56px rgba(0,0,0,.9);

    --slide-h:        min(72vh, 780px);
    --grid-min:       240px;
    --title-size:     1.15rem;
    --header-pad-y:   14px;
    --header-pad-x:   24px;
    --main-pad:       24px;
    --nav-size:       46px;
    --nav-font:       24px;
    --nav-offset:     14px;
    --cap-font:       .95rem;
    --cap-pad:        16px 20px 16px 22px;
    --cap-min-h:      64px;
    --thumb-font:     .8rem;
    --thumb-pad-y:    7px;
    --thumb-pad-x:    14px;
    --thumb-gap:      6px;
    --counter-font:   .78rem;
    --radius-card:    6px;
    --radius-pill:    4px;

    --theme-fade: 0.9s;
  }

  html.is-tablet{
    --slide-h:      min(62vh, 620px);
    --main-pad:     20px;
    --header-pad-y: 13px;
    --header-pad-x: 20px;
    --nav-size:     42px;
    --nav-font:     22px;
    --cap-font:     .92rem;
    --thumb-font:   .78rem;
  }
  html.is-mobile{
    --slide-h:      52vh;
    --grid-min:     150px;
    --title-size:   1rem;
    --header-pad-y: 12px;
    --header-pad-x: 14px;
    --main-pad:     14px;
    --nav-size:     38px;
    --nav-font:     20px;
    --nav-offset:   10px;
    --cap-font:     .88rem;
    --cap-pad:      12px 14px 12px 18px;
    --cap-min-h:    54px;
    --thumb-font:   .74rem;
    --thumb-pad-y:  6px;
    --thumb-pad-x:  11px;
    --thumb-gap:    5px;
    --counter-font: .72rem;
  }
  @supports (height: 100dvh){
    html.is-mobile{ --slide-h: 52dvh; }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}

  /* =========================================================
     動態背景
     ========================================================= */
  #bg{
    position: fixed; inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }
  .bg-layer{
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity var(--theme-fade) ease;
    will-change: opacity;
  }
  .bg-layer.active{ opacity: 1; }

  /* 漂移光球：更亮、更大、對比更明顯 */
  .bg-layer::before{
    content: '';
    position: absolute;
    width: 95vmax; height: 95vmax;
    border-radius: 50%;
    top: 50%; left: 50%;
    margin: -47.5vmax 0 0 -47.5vmax;
    filter: blur(40px);
    opacity: .85;
    animation: drift 40s ease-in-out infinite alternate;
    mix-blend-mode: screen;
  }
  /* 掃描線：對比拉高，但仍維持細緻 */
  .bg-layer::after{
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        0deg,
        transparent 0 3px,
        rgba(0,0,0,.14) 3px 4px
      );
    opacity: .5;
    pointer-events: none;
  }

  /* --- 各自主題背景（亮暗對比加大） --- */
  .bg-layer[data-theme="steel"]{
    background:
      linear-gradient(rgba(94,184,255,.08) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(94,184,255,.08) 1px, transparent 1px) 0 0 / 32px 32px,
      radial-gradient(ellipse 90% 65% at 15% 0%, #1e4270 0%, transparent 55%),
      radial-gradient(ellipse 85% 65% at 88% 100%, #0f2a55 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 50%, #0a1930 0%, transparent 70%),
      #02050a;
  }
  .bg-layer[data-theme="steel"]::before{
    background: radial-gradient(circle, rgba(94,184,255,.85) 0%, transparent 55%);
  }

  .bg-layer[data-theme="forge"]{
    background:
      linear-gradient(rgba(255,107,26,.09) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(255,107,26,.09) 1px, transparent 1px) 0 0 / 32px 32px,
      radial-gradient(ellipse 100% 75% at 50% 115%, #7a2408 0%, transparent 55%),
      radial-gradient(ellipse 75% 55% at 88% -10%, #5a2408 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 20% 50%, #3a1406 0%, transparent 70%),
      #0a0202;
  }
  .bg-layer[data-theme="forge"]::before{
    background: radial-gradient(circle, rgba(255,107,26,.9) 0%, transparent 55%);
  }

  .bg-layer[data-theme="jungle"]{
    background:
      linear-gradient(rgba(77,255,138,.08) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(77,255,138,.08) 1px, transparent 1px) 0 0 / 32px 32px,
      radial-gradient(ellipse 90% 65% at 10% 5%, #0f5426 0%, transparent 55%),
      radial-gradient(ellipse 85% 65% at 90% 95%, #0e4a24 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 60%, #082e16 0%, transparent 70%),
      #020703;
  }
  .bg-layer[data-theme="jungle"]::before{
    background: radial-gradient(circle, rgba(77,255,138,.85) 0%, transparent 55%);
  }

  .bg-layer[data-theme="midnight"]{
    background:
      linear-gradient(rgba(181,112,255,.09) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(181,112,255,.09) 1px, transparent 1px) 0 0 / 32px 32px,
      radial-gradient(ellipse 90% 65% at 18% 12%, #4a1c8e 0%, transparent 55%),
      radial-gradient(ellipse 85% 65% at 88% 92%, #3a1470 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 50%, #1e0c4a 0%, transparent 70%),
      #05020f;
  }
  .bg-layer[data-theme="midnight"]::before{
    background: radial-gradient(circle, rgba(181,112,255,.9) 0%, transparent 55%);
  }

  .bg-layer[data-theme="carbon"]{
    background:
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px) 0 0 / 28px 28px,
      radial-gradient(ellipse 90% 65% at 22% 8%, #333333 0%, transparent 55%),
      radial-gradient(ellipse 85% 65% at 85% 95%, #262626 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 50%, #161616 0%, transparent 70%),
      #000000;
  }
  .bg-layer[data-theme="carbon"]::before{
    background: radial-gradient(circle, rgba(255,255,255,.45) 0%, transparent 55%);
  }

  @keyframes drift{
    0%  { transform: translate(-8%, -6%) scale(1); }
    50% { transform: translate(6%, 4%)   scale(1.08); }
    100%{ transform: translate(10%, -4%) scale(1); }
  }

  /* ===== 頁面本體 ===== */
  body{
    background: transparent;
    color: var(--fg);
    min-height: 100vh;
    font-family: "Rajdhani", "Oswald", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
                 system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    letter-spacing: .01em;
    transition: color var(--theme-fade) ease;
  }

  /* ===== Header ===== */
  header{
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px;
    padding: var(--header-pad-y) var(--header-pad-x);
    background: rgba(0,0,0,.7);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 16px rgba(0,0,0,.9);
    transition: border-color var(--theme-fade) ease;
  }
  header::after{
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%, var(--accent) 15%, var(--accent) 85%, transparent 100%);
    opacity: .9;
    box-shadow: 0 0 12px var(--glow);
    transition: background var(--theme-fade) ease, box-shadow var(--theme-fade) ease;
  }
  h1{
    font-size: var(--title-size);
    margin: 0;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    word-break: break-all;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: color var(--theme-fade) ease;
  }
  h1::before{
    content: '';
    display: inline-block;
    width: 4px;
    height: 1.1em;
    background: var(--accent);
    box-shadow: 0 0 20px var(--glow), 0 0 40px var(--glow);
    flex: 0 0 auto;
    transition: background var(--theme-fade) ease, box-shadow var(--theme-fade) ease;
  }
  .btn{
    background: var(--bg-2);
    color: var(--fg);
    border: 1px solid var(--line-hi);
    padding: 7px 16px;
    border-radius: var(--radius-pill);
    font-size: .82rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
    transition:
      background-color var(--theme-fade) ease,
      border-color var(--theme-fade) ease,
      color .15s ease,
      box-shadow .15s ease,
      transform .15s ease;
  }
  .btn:hover{
    background: var(--bg-3);
    border-color: var(--accent);
    color: var(--accent-hi);
    box-shadow: var(--shadow-sm), 0 0 16px var(--glow);
  }
  .btn:active{
    transform: translateY(1px);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
  }
  html.is-mobile .btn{padding: 6px 12px; font-size: .75rem;}

  #themeBtn{
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 10px;
    background: var(--bg-2);
    border: 1px solid var(--line-hi);
    border-radius: var(--radius-pill);
    color: var(--fg);
    font-family: inherit;
    font-size: .72rem;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition:
      background-color var(--theme-fade) ease,
      border-color .15s ease,
      color var(--theme-fade) ease,
      box-shadow .15s ease;
  }
  #themeBtn:hover{
    border-color: var(--accent);
    color: var(--accent-hi);
    box-shadow: var(--shadow-sm), 0 0 16px var(--glow);
  }
  #themeBtn .dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--glow), 0 0 20px var(--glow);
    animation: pulse 2.4s ease-in-out infinite;
    transition: background var(--theme-fade) ease, box-shadow var(--theme-fade) ease;
  }
  #themeBtn .txt{
    min-width: 62px;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }
  #themeBtn .pause{ opacity: .5; font-size: .9rem; line-height: 1; }
  html.is-mobile #themeBtn{padding: 5px 10px; font-size: .68rem;}
  html.is-mobile #themeBtn .txt{min-width: 52px;}

  @keyframes pulse{
    0%,100%{ opacity: 1;   transform: scale(1); }
    50%    { opacity: .55; transform: scale(.85); }
  }

  /* ===== Main ===== */
  main{
    padding: var(--main-pad);
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .hint{
    color: var(--muted);
    text-align: center;
    padding: 60px 20px;
    line-height: 1.9;
    font-weight: 500;
    letter-spacing: .04em;
    transition: color var(--theme-fade) ease;
  }

  /* ===== 目錄列表 ===== */
  .dir-list{
    list-style: none; padding: 0; margin: 0;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(var(--grid-min), 1fr));
  }
  html.is-mobile .dir-list{gap: 10px;}
  .dir-list li{
    animation: slideIn .4s cubic-bezier(.22,.61,.36,1) both;
  }
  .dir-link{
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 20px 22px;
    background: linear-gradient(135deg, var(--bg-2) 0%, var(--bg-0) 100%);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line-hi);
    border-radius: var(--radius-card);
    color: var(--fg);
    text-decoration: none;
    font-weight: 700;
    letter-spacing: .04em;
    box-shadow: var(--shadow-sm);
    transition:
      background-image var(--theme-fade) ease,
      border-color var(--theme-fade) ease,
      color var(--theme-fade) ease,
      transform .18s ease,
      box-shadow .18s ease;
    position: relative;
    overflow: hidden;
  }
  .dir-link::after{
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 60px; height: 60px;
    background: repeating-linear-gradient(
      -45deg, transparent 0 4px, rgba(255,255,255,.04) 4px 8px);
    pointer-events: none;
  }
  html.is-mobile .dir-link{padding: 15px 16px;}
  .dir-link:hover{
    transform: translateX(3px);
    border-left-color: var(--accent);
    border-color: var(--line-hi);
    background: linear-gradient(135deg, var(--bg-3) 0%, var(--bg-1) 100%);
    box-shadow: var(--shadow), 0 0 24px var(--glow);
  }
  .dir-link > *{position: relative; z-index: 1;}
  .dir-name{word-break: break-all; font-size: 1rem;}
  html.is-mobile .dir-name{font-size: .92rem;}
  .dir-arrow{
    color: var(--muted);
    font-size: 1.5rem;
    line-height: 1;
    font-weight: 400;
    transition: all .18s ease;
  }
  .dir-link:hover .dir-arrow{
    color: var(--accent);
    transform: translateX(4px);
    text-shadow: 0 0 12px var(--glow);
  }

  /* ===== 主檔名導航列 ===== */
  .thumbs{
    display: flex;
    gap: var(--thumb-gap);
    overflow-x: auto; overflow-y: hidden;
    padding: 2px 2px 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--line-hi) transparent;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  .thumbs::-webkit-scrollbar{height: 5px;}
  .thumbs::-webkit-scrollbar-track{background: transparent;}
  .thumbs::-webkit-scrollbar-thumb{background: var(--line-hi); border-radius: 0;}
  .thumbs::-webkit-scrollbar-thumb:hover{background: var(--accent);}
  html.is-mobile .thumbs{padding-bottom: 10px;}

  .thumb{
    flex: 0 0 auto;
    padding: var(--thumb-pad-y) var(--thumb-pad-x);
    border-radius: var(--radius-pill);
    background: var(--bg-2);
    color: var(--muted);
    border: 1px solid var(--line);
    font-family: inherit;
    font-size: var(--thumb-font);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    letter-spacing: .08em;
    line-height: 1.2;
    transition:
      background-color var(--theme-fade) ease,
      border-color var(--theme-fade) ease,
      color var(--theme-fade) ease,
      box-shadow .15s ease,
      transform .15s ease;
  }
  html.is-mobile .thumb,
  html.is-tablet .thumb{ min-height: 34px; padding: 8px var(--thumb-pad-x); }
  .thumb:hover{
    color: var(--fg);
    border-color: var(--line-hi);
    background: var(--bg-3);
  }
  .thumb.active{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
    font-weight: 800;
    box-shadow:
      0 0 16px var(--glow),
      0 0 32px var(--glow),
      inset 0 -2px 0 rgba(0,0,0,.15);
  }

  /* ===== 輪播 ===== */
  .carousel{
    position: relative;
    background: var(--bg-0);
    border-radius: var(--radius-card);
    overflow: hidden;
    user-select: none;
    touch-action: pan-y;
    box-shadow: var(--shadow-lg), 0 0 60px -20px var(--glow);
    border: 1px solid var(--line-hi);
    animation: slideIn .45s cubic-bezier(.22,.61,.36,1) both;
    cursor: grab;
    transition:
      background-color var(--theme-fade) ease,
      border-color var(--theme-fade) ease,
      box-shadow var(--theme-fade) ease;
  }
  .carousel::before,
  .carousel::after{
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    border: 2px solid var(--accent);
    z-index: 3;
    pointer-events: none;
    opacity: .9;
    box-shadow: 0 0 8px var(--glow);
    transition: border-color var(--theme-fade) ease, box-shadow var(--theme-fade) ease;
  }
  .carousel::before{ top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
  .carousel::after { top: 8px; right: 8px; border-left: 0; border-bottom: 0; }
  .carousel:active{cursor: grabbing;}
  html.is-mobile .carousel{cursor: auto;}
  .track{display: flex; will-change: transform;}
  .slide{
    flex: 0 0 100%;
    height: var(--slide-h);
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,255,255,.02) 0%, transparent 70%),
      var(--bg-0);
    position: relative;
    transition: background-color var(--theme-fade) ease;
  }
  .slide::after{
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: linear-gradient(90deg,
      transparent 0%, var(--accent) 20%, var(--accent) 80%, transparent 100%);
    opacity: .55;
    box-shadow: 0 0 12px var(--glow);
    pointer-events: none;
    transition: background var(--theme-fade) ease, box-shadow var(--theme-fade) ease;
  }
  .slide img{
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
    pointer-events: none; -webkit-user-drag: none;
    filter: contrast(1.06) saturate(1.08);
    transition: filter var(--theme-fade) ease;
  }
  .nav{
    position: absolute; top: 50%; transform: translateY(-50%);
    width: var(--nav-size); height: var(--nav-size);
    border-radius: var(--radius-pill);
    border: 1px solid var(--line-hi);
    background: rgba(0,0,0,.85);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--fg);
    font-size: var(--nav-font); line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
    font-weight: 400;
    padding: 0 0 4px 0;
    z-index: 2;
    box-shadow: var(--shadow);
    transition:
      background-color .18s ease,
      border-color var(--theme-fade) ease,
      color var(--theme-fade) ease,
      box-shadow .18s ease,
      transform .15s ease;
  }
  html.is-mobile .nav{opacity: .85; box-shadow: var(--shadow-sm);}
  .nav:hover{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
    box-shadow: 0 0 24px var(--glow), 0 0 48px var(--glow), var(--shadow);
  }
  .nav:active{transform: translateY(-50%) scale(.94);}
  .nav:disabled{opacity: 0; pointer-events: none;}
  .nav.prev{left: var(--nav-offset);}
  .nav.next{right: var(--nav-offset);}

  .counter{
    position: absolute; right: 14px; bottom: 12px;
    background: rgba(0,0,0,.92);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--accent);
    font-size: var(--counter-font);
    font-weight: 800;
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    letter-spacing: .12em;
    z-index: 2; pointer-events: none;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--line-hi);
    box-shadow: var(--shadow-sm), 0 0 12px var(--glow);
    text-shadow: 0 0 10px var(--glow);
    transition: color var(--theme-fade) ease, border-color var(--theme-fade) ease,
                box-shadow var(--theme-fade) ease, text-shadow var(--theme-fade) ease;
  }
  html.is-mobile .counter{right: 8px; bottom: 8px; padding: 3px 9px;}

  /* ===== 說明 ===== */
  .caption{
    margin-top: 16px;
    padding: var(--cap-pad);
    background: linear-gradient(135deg, var(--bg-2) 0%, var(--bg-0) 100%);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-card);
    font-size: var(--cap-font);
    line-height: 1.7;
    font-weight: 500;
    color: var(--fg);
    white-space: pre-wrap;
    word-break: break-word;
    min-height: var(--cap-min-h);
    box-shadow: var(--shadow-sm), inset 0 0 0 1px rgba(255,255,255,.02);
    position: relative;
    animation: slideIn .45s .05s cubic-bezier(.22,.61,.36,1) both;
    transition:
      background-image var(--theme-fade) ease,
      border-color var(--theme-fade) ease,
      color var(--theme-fade) ease,
      box-shadow var(--theme-fade) ease;
  }
  html.is-mobile .caption{margin-top: 12px;}
  .caption .num{
    display: inline-block;
    font-size: .72rem;
    background: var(--accent);
    color: var(--accent-fg);
    padding: 2px 9px;
    border-radius: var(--radius-pill);
    margin-right: 10px;
    font-variant-numeric: tabular-nums;
    vertical-align: middle;
    font-weight: 800;
    letter-spacing: .12em;
    box-shadow: 0 0 12px var(--glow);
    transition: background-color var(--theme-fade) ease, color var(--theme-fade) ease,
                box-shadow var(--theme-fade) ease;
  }
  .caption.empty{
    color: var(--muted);
    font-style: italic;
    font-weight: 400;
    border-left-color: var(--line-hi);
  }

  /* ===== 燈箱 ===== */
  #lightbox{
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.95);
    -webkit-backdrop-filter: blur(20px) saturate(1.1);
    backdrop-filter: blur(20px) saturate(1.1);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 24px; cursor: zoom-out;
    animation: fadeIn .2s ease both;
  }
  html.is-mobile #lightbox{padding: 14px; gap: 12px;}
  #lightbox[hidden]{display: none;}
  #lightbox img{
    max-width: 100%; max-height: 78vh;
    object-fit: contain;
    border-radius: var(--radius-card);
    border: 1px solid var(--line-hi);
    box-shadow:
      0 30px 90px -20px rgba(0,0,0,.95),
      0 0 80px var(--glow);
    animation: slideIn .3s cubic-bezier(.22,.61,.36,1) both;
    filter: contrast(1.06) saturate(1.08);
    transition: border-color var(--theme-fade) ease, box-shadow var(--theme-fade) ease,
                filter var(--theme-fade) ease;
  }
  html.is-mobile #lightbox img{max-height: 70vh;}
  #lightbox p{
    margin: 0;
    color: var(--fg);
    text-align: center;
    max-width: 820px;
    line-height: 1.7;
    font-weight: 500;
    padding: 12px 20px;
    background: rgba(0,0,0,.85);
    border: 1px solid var(--line-hi);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-card);
    box-shadow: 0 0 24px -8px var(--glow);
    transition: border-color var(--theme-fade) ease, color var(--theme-fade) ease,
                box-shadow var(--theme-fade) ease;
  }
  html.is-mobile #lightbox p{font-size: .88rem; padding: 10px 14px;}
  #lightbox p[hidden]{display: none;}

  /* ===== 動畫 ===== */
  @keyframes slideIn{
    from{opacity: 0; transform: translateX(-8px);}
    to  {opacity: 1; transform: translateX(0);}
  }
  @keyframes fadeIn{
    from{opacity: 0;}
    to  {opacity: 1;}
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
    .bg-layer::before{ animation: none; }
  }
</style>
</head>
<body>

<div id="bg" aria-hidden="true">
  <div class="bg-layer active" data-theme="steel"></div>
  <div class="bg-layer"        data-theme="forge"></div>
  <div class="bg-layer"        data-theme="jungle"></div>
  <div class="bg-layer"        data-theme="midnight"></div>
  <div class="bg-layer"        data-theme="carbon"></div>
</div>

<header>
  <button id="back" class="btn" hidden>← 回目錄</button>
  <h1 id="title">台電受訓</h1>
  <button id="themeBtn" type="button" title="點擊切換主題，雙擊暫停 / 繼續自動切換">
    <span class="dot"></span>
    <span class="txt">STEEL</span>
    <span class="pause">⏸</span>
  </button>
</header>

<main id="view"></main>

<div id="lightbox" hidden>
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     0. 主題系統
     ========================================================= */
  const THEMES = [
    { id: 'steel',    label: 'STEEL'    },
    { id: 'forge',    label: 'FORGE'    },
    { id: 'jungle',   label: 'JUNGLE'   },
    { id: 'midnight', label: 'MIDNIGHT' },
    { id: 'carbon',   label: 'CARBON'   },
  ];
  const THEME_INTERVAL = 1500;   // 每 3 秒換一個主題

  const themeSystem = (() => {
    const htmlEl  = document.documentElement;
    const layers  = Array.from(document.querySelectorAll('.bg-layer'));
    const btn     = document.getElementById('themeBtn');
    const btnTxt  = btn.querySelector('.txt');
    const btnIco  = btn.querySelector('.pause');

    let current   = 0;
    let autoTimer = null;
    let paused    = false;
    let reduced   = window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function apply(i) {
      i = ((i % THEMES.length) + THEMES.length) % THEMES.length;
      current = i;
      const theme = THEMES[i];

      htmlEl.setAttribute('data-theme', theme.id);

      layers.forEach(l => {
        const on = l.dataset.theme === theme.id;
        if (on) l.classList.add('active');
        else    l.classList.remove('active');
      });

      btnTxt.textContent = theme.label;
    }

    function next() { apply(current + 1); }

    function startAuto() {
      stopAuto();
      if (reduced || paused) return;
      autoTimer = setInterval(next, THEME_INTERVAL);
    }
    function stopAuto() {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    }
    function resetAuto() { if (!paused && !reduced) startAuto(); }

    function setPaused(p) {
      paused = p;
      btnIco.textContent = p ? '▶' : '⏸';
      btn.title = p
        ? '已暫停自動切換（雙擊恢復）'
        : '點擊切換主題，雙擊暫停 / 繼續自動切換';
      if (p) stopAuto();
      else   startAuto();
    }

    let clickTimer = null;
    btn.addEventListener('click', () => {
      if (clickTimer) {
        clearTimeout(clickTimer);
        clickTimer = null;
        setPaused(!paused);
        return;
      }
      clickTimer = setTimeout(() => {
        clickTimer = null;
        next();
        resetAuto();
      }, 220);
    });

    apply(0);
    startAuto();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') resetAuto();
    });

    return { apply, next, setPaused, startAuto, stopAuto };
  })();

  /* =========================================================
     1. 裝置偵測
     ========================================================= */
  const device = {
    current: null,
    detect() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const shortSide = Math.min(w, h);
      const ua = navigator.userAgent || '';
      const isMobileUA = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
      const isTabletUA = /iPad|Tablet|PlayBook|Silk/i.test(ua) ||
                         (isMobileUA && !/Mobile/i.test(ua));
      const isTouch = ('ontouchstart' in window) ||
                      (navigator.maxTouchPoints > 0) ||
                      (window.matchMedia && matchMedia('(hover: none)').matches);
      if (shortSide < 600 || (isMobileUA && shortSide < 768)) return 'mobile';
      if (shortSide < 1024 || isTabletUA || (isTouch && shortSide < 1200)) return 'tablet';
      return 'desktop';
    },
    apply(force) {
      const type = this.detect();
      if (!force && type === this.current) return;
      this.current = type;
      const el = document.documentElement;
      el.dataset.device = type;
      el.classList.remove('is-mobile', 'is-tablet', 'is-desktop');
      el.classList.add('is-' + type);
    }
  };
  device.apply(true);

  let resizeTimer = null;
  function onResizeDebounced(delay) {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => device.apply(), delay || 120);
  }
  window.addEventListener('resize', () => onResizeDebounced(120));
  window.addEventListener('orientationchange', () => onResizeDebounced(250));

  /* =========================================================
     設定區
     ========================================================= */
  const MANUAL_DIRS = [
    // 'test1',
  ];
  const DIRS_FILE = './dirs.txt';
  const IMG_EXT   = 'jpg';

  const MAX_SCAN   = 1000;
  const SCAN_BATCH = 16;
  const LOAD_BATCH = 16;
  const MISS_LIMIT = 6;

  /* =========================================================
     小工具
     ========================================================= */
  const $ = s => document.querySelector(s);
  const view     = $('#view');
  const titleEl  = $('#title');
  const backBtn  = $('#back');
  const lightbox = $('#lightbox');
  const lbImg    = $('#lbImg');
  const lbCap    = $('#lbCap');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const pad3   = n => String(n).padStart(3, '0');
  const imgURL = (dir, num) => `${dir}/${num}.${IMG_EXT}`;

  let pageAbort = null;

  /* =========================================================
     2. 找出所有子目錄
     ========================================================= */
  async function discoverDirs() {
    const found = new Set(MANUAL_DIRS);

    const listText = await fetchTextSmart(DIRS_FILE);
    if (listText) {
      listText.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
        const s = line.trim();
        if (!s || s.startsWith('#')) return;
        const name = s.replace(/\/+$/, '');
        if (name && !name.includes('/') && !name.startsWith('.')) found.add(name);
      });
    }

    try {
      const res = await fetch('./', { cache: 'no-store' });
      if (res.ok) {
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        if (!doc.querySelector('meta[name="app"]')) {
          const base = new URL('./', location.href);
          doc.querySelectorAll('a[href]').forEach(a => {
            let u;
            try { u = new URL(a.getAttribute('href'), base); } catch (_) { return; }
            if (u.origin !== base.origin) return;
            if (!u.pathname.startsWith(base.pathname)) return;
            if (!u.pathname.endsWith('/')) return;
            let rel;
            try { rel = decodeURIComponent(u.pathname.slice(base.pathname.length)); }
            catch (_) { return; }
            if (!rel.endsWith('/')) return;
            const name = rel.slice(0, -1);
            if (!name || name.includes('/') || name.startsWith('.')) return;
            found.add(name);
          });
        }
      }
    } catch (_) {}

    return [...found].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  }

  /* =========================================================
     3. 讀文字檔
     ========================================================= */
  async function fetchTextSmart(url) {
    let res;
    try { res = await fetch(url, { cache: 'no-store' }); }
    catch (_) { return null; }
    if (!res.ok) return null;

    const buf = await res.arrayBuffer();
    if (!buf.byteLength) return '';

    const b = new Uint8Array(buf);
    if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF)
      return new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/, '');
    if (b[0] === 0xFF && b[1] === 0xFE) {
      try { return new TextDecoder('utf-16le').decode(buf).replace(/^\uFEFF/, ''); } catch (_) {}
    }
    if (b[0] === 0xFE && b[1] === 0xFF) {
      try { return new TextDecoder('utf-16be').decode(buf).replace(/^\uFEFF/, ''); } catch (_) {}
    }

    let text = new TextDecoder('utf-8').decode(buf);
    if (!text.includes('\uFFFD')) return text.replace(/^\uFEFF/, '');

    for (const enc of ['big5', 'big5-hkscs', 'ms950', 'gbk', 'gb18030']) {
      try {
        const t = new TextDecoder(enc).decode(buf);
        if (t && !t.includes('\uFFFD')) return t.replace(/^\uFEFF/, '');
      } catch (_) {}
    }
    return text;
  }

  /* =========================================================
     4. 解析 content.txt
     ========================================================= */
  function parseContent(text) {
    const map = new Map();
    text.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
      const s = line.trim();
      if (!s) return;
      const m = s.match(/^(\d+)(?:\s+([\s\S]*))?$/);
      if (!m) return;
      map.set(pad3(m[1]), (m[2] || '').trim());
    });
    return map;
  }

  /* =========================================================
     5. 圖片載入
     ========================================================= */
  function loadImage(url) {
    return new Promise(resolve => {
      const img = new Image();
      img.decoding = 'async';
      img.onload  = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  async function loadList(dir, nums) {
    const out = [];
    for (let i = 0; i < nums.length; i += LOAD_BATCH) {
      const batch = nums.slice(i, i + LOAD_BATCH);
      const res = await Promise.all(batch.map(n => loadImage(imgURL(dir, n))));
      for (let k = 0; k < res.length; k++) {
        if (res[k]) out.push({ num: batch[k], img: res[k] });
      }
    }
    return out;
  }

  async function scanItems(dir) {
    const out = [];
    let misses = 0;
    for (let i = 0; i < MAX_SCAN && misses < MISS_LIMIT; i += SCAN_BATCH) {
      const batch = [];
      for (let k = 0; k < SCAN_BATCH && i + k < MAX_SCAN; k++) batch.push(pad3(i + k));
      const res = await Promise.all(batch.map(n => loadImage(imgURL(dir, n))));
      for (let k = 0; k < res.length; k++) {
        if (res[k]) { out.push({ num: batch[k], img: res[k] }); misses = 0; }
        else misses++;
      }
    }
    return out;
  }

  /* =========================================================
     6. 燈箱
     ========================================================= */
  function openLightbox(item) {
    lbImg.src = item.img.src;
    lbImg.alt = item.cap || item.num;
    lbCap.textContent = item.cap || '';
    lbCap.hidden = !item.cap;
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.hidden = true;
    lbImg.src = '';
    document.body.style.overflow = '';
  }
  lightbox.addEventListener('click', closeLightbox);

  /* =========================================================
     7. 目錄列表
     ========================================================= */
  async function renderIndex() {
    if (pageAbort) { pageAbort.abort(); pageAbort = null; }
    backBtn.hidden = true;
    titleEl.textContent = '台電受訓';
    document.title = '台電受訓';
    view.innerHTML = '';
    view.appendChild(el('p', 'hint', '讀取目錄中…'));

    const dirs = await discoverDirs();
    view.innerHTML = '';

    if (!dirs.length) {
      const p = el('p', 'hint');
      p.appendChild(document.createTextNode('找不到任何子目錄。'));
      p.appendChild(document.createElement('br'));
      p.appendChild(document.createTextNode(
        '請在根目錄建立 dirs.txt（一行一個目錄名稱），或在 index.html 的 MANUAL_DIRS 陣列中手動填入。'
      ));
      view.appendChild(p);
      return;
    }

    const ul = el('ul', 'dir-list');
    dirs.forEach((d, i) => {
      const li = el('li');
      li.style.animationDelay = (i * 35) + 'ms';
      const a = el('a', 'dir-link');
      a.href = '#/' + encodeURIComponent(d);
      a.appendChild(el('span', 'dir-name', d));
      a.appendChild(el('span', 'dir-arrow', '›'));
      li.appendChild(a);
      ul.appendChild(li);
    });
    view.appendChild(ul);
  }

  /* =========================================================
     8. 相簿內容
     ========================================================= */
  async function renderGallery(dir) {
    if (pageAbort) pageAbort.abort();
    pageAbort = new AbortController();
    const signal = pageAbort.signal;

    backBtn.hidden = false;
    titleEl.textContent = dir;
    document.title = dir + ' — 台電受訓';
    view.innerHTML = '';
    view.appendChild(el('p', 'hint', '載入中…'));

    const txt = await fetchTextSmart(dir + '/content.txt');
    const map = txt ? parseContent(txt) : null;

    let items, hasList = false;
    if (map && map.size) {
      hasList = true;
      const nums = [...map.keys()].sort((a, b) =>
        a.localeCompare(b, undefined, { numeric: true })
      );
      items = await loadList(dir, nums);
      items.forEach(it => { it.cap = map.get(it.num) || ''; });
    } else {
      items = await scanItems(dir);
      items.forEach(it => { it.cap = ''; });
    }

    if (!items.length) {
      view.innerHTML = '';
      view.appendChild(el('p', 'hint',
        hasList ? '清單中的編號都找不到對應圖片。' : '這個目錄裡找不到圖片。'));
      return;
    }

    view.innerHTML = '';

    const thumbs = el('div', 'thumbs');
    const thumbBtns = items.map((it, i) => {
      const b = el('button', 'thumb', it.num);
      b.type = 'button';
      b.title = it.cap ? (it.num + ' — ' + it.cap) : it.num;
      b.setAttribute('aria-label', '跳到 ' + it.num);
      b.addEventListener('click', () => goTo(i));
      thumbs.appendChild(b);
      return b;
    });

    const carousel = el('div', 'carousel');
    const track    = el('div', 'track');

    items.forEach(it => {
      const slide = el('div', 'slide');
      slide.appendChild(it.img);
      track.appendChild(slide);
    });
    carousel.appendChild(track);

    const prevBtn = el('button', 'nav prev');
    prevBtn.type = 'button';
    prevBtn.setAttribute('aria-label', '上一張');
    prevBtn.textContent = '‹';

    const nextBtn = el('button', 'nav next');
    nextBtn.type = 'button';
    nextBtn.setAttribute('aria-label', '下一張');
    nextBtn.textContent = '›';

    const counter = el('div', 'counter');

    carousel.appendChild(prevBtn);
    carousel.appendChild(nextBtn);
    carousel.appendChild(counter);

    const capBox = el('div', 'caption');

    view.appendChild(thumbs);
    view.appendChild(carousel);
    view.appendChild(capBox);

    let idx = 0;
    const total = items.length;
    let activeThumb = -1;

    function goTo(i, animate) {
      if (animate === undefined) animate = true;
      idx = Math.max(0, Math.min(total - 1, i));

      track.style.transition = animate
        ? 'transform .3s cubic-bezier(.22,.61,.36,1)'
        : 'none';
      track.style.transform = `translateX(${-idx * 100}%)`;

      counter.textContent = pad3(idx + 1) + ' / ' + pad3(total);
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx >= total - 1;

      if (activeThumb !== idx) {
        if (thumbBtns[activeThumb]) thumbBtns[activeThumb].classList.remove('active');
        const t = thumbBtns[idx];
        if (t) {
          t.classList.add('active');
          try {
            t.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
          } catch (_) { t.scrollIntoView(false); }
        }
        activeThumb = idx;
      }

      const it = items[idx];
      capBox.innerHTML = '';
      capBox.appendChild(el('span', 'num', it.num));
      if (it.cap) {
        capBox.classList.remove('empty');
        capBox.appendChild(document.createTextNode(it.cap));
      } else {
        capBox.classList.add('empty');
        capBox.appendChild(document.createTextNode('（無說明）'));
      }
    }

    prevBtn.addEventListener('click', () => goTo(idx - 1));
    nextBtn.addEventListener('click', () => goTo(idx + 1));

    let down = false, dragging = false;
    let startX = 0, startY = 0;
    let activePointer = null;

    function onDown(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      down = true;
      dragging = false;
      activePointer = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      track.style.transition = 'none';
    }

    function onMove(e) {
      if (!down || e.pointerId !== activePointer) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (!dragging) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        if (Math.abs(dy) > Math.abs(dx)) {
          down = false;
          activePointer = null;
          goTo(idx);
          return;
        }
        dragging = true;
      }

      if (e.cancelable) e.preventDefault();

      const w = carousel.offsetWidth || 1;
      const pct = (-idx * 100) + (dx / w) * 100;
      track.style.transform = `translateX(${pct}%)`;
    }

    function onUp(e) {
      if (!down) return;
      if (activePointer !== null && e.pointerId !== activePointer) return;

      const wasDragging = dragging;
      const dx = e.clientX - startX;
      down = false;
      dragging = false;
      activePointer = null;

      if (wasDragging) {
        const threshold = Math.max(50, carousel.offsetWidth * 0.15);
        if (dx < -threshold)     goTo(idx + 1);
        else if (dx > threshold) goTo(idx - 1);
        else                     goTo(idx);
      } else {
        openLightbox(items[idx]);
      }
    }

    track.addEventListener('pointerdown', onDown, { signal });
    document.addEventListener('pointermove', onMove, { passive: false, signal });
    document.addEventListener('pointerup', onUp, { signal });
    document.addEventListener('pointercancel', onUp, { signal });

    if (device.current === 'desktop') {
      document.addEventListener('keydown', e => {
        if (!lightbox.hidden) {
          if (e.key === 'Escape') closeLightbox();
          return;
        }
        if (e.key === 'ArrowLeft')  { goTo(idx - 1); e.preventDefault(); }
        if (e.key === 'ArrowRight') { goTo(idx + 1); e.preventDefault(); }
      }, { signal });
    }

    goTo(0, false);
  }

  /* =========================================================
     9. 路由
     ========================================================= */
  function currentDir() {
    const h = location.hash.replace(/^#\/?/, '');
    if (!h) return null;
    try { return decodeURIComponent(h); } catch (_) { return h; }
  }

  async function render() {
    window.scrollTo(0, 0);
    const dir = currentDir();
    if (dir) await renderGallery(dir);
    else await renderIndex();
  }

  backBtn.addEventListener('click', () => { location.hash = '#/'; });
  window.addEventListener('hashchange', render);

  render();
})();
</script>
</body>
</html>
