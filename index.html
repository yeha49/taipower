<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app" content="gallery-index">
<title>台電受訓</title>
<style>
  :root{
    --bg:#0e1013; --panel:#171a20; --fg:#e9ecf1; --muted:#9aa3af;
    --line:#252a33; --accent:#5aa9ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--fg); min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:14px;
    padding:14px 24px;
    background:rgba(14,16,19,.85);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  h1{font-size:1.15rem; margin:0; font-weight:600; letter-spacing:.02em; word-break:break-all;}
  .btn{
    background:#222833; color:var(--fg); border:1px solid var(--line);
    padding:7px 14px; border-radius:999px; font-size:.9rem; cursor:pointer;
    font-family:inherit; transition:background .15s; white-space:nowrap;
  }
  .btn:hover{background:#2c3442;}

  main{padding:24px; max-width:1400px; margin:0 auto;}
  .hint{color:var(--muted); text-align:center; padding:48px 0; line-height:1.8;}

  /* ---- 目錄列表 ---- */
  .dir-list{
    list-style:none; padding:0; margin:0; display:grid; gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  }
  .dir-link{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:18px 20px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; color:var(--fg); text-decoration:none;
    transition:transform .15s, border-color .15s, background .15s;
  }
  .dir-link:hover{transform:translateY(-2px); border-color:var(--accent); background:#1c212a;}
  .dir-name{font-weight:600; word-break:break-all;}
  .dir-arrow{color:var(--muted); font-size:1.3rem; line-height:1;}

  /* ---- 主檔名導航列 ---- */
  .thumbs{
    display:flex; gap:8px; overflow-x:auto; overflow-y:hidden;
    padding:2px 2px 14px;
    scrollbar-width:thin;
    scrollbar-color:#2c3442 transparent;
  }
  .thumbs::-webkit-scrollbar{height:6px;}
  .thumbs::-webkit-scrollbar-track{background:transparent;}
  .thumbs::-webkit-scrollbar-thumb{background:#2c3442; border-radius:999px;}
  .thumbs::-webkit-scrollbar-thumb:hover{background:#3a4250;}
  .thumb{
    flex:0 0 auto;
    padding:6px 13px; border-radius:999px;
    background:var(--panel); color:var(--muted);
    border:1px solid var(--line);
    font-family:inherit; font-size:.82rem;
    font-variant-numeric:tabular-nums;
    cursor:pointer; transition:color .15s, background .15s, border-color .15s;
    letter-spacing:.04em; line-height:1.2;
  }
  .thumb:hover{color:var(--fg); border-color:#3a4250;}
  .thumb.active{
    background:var(--accent); border-color:var(--accent);
    color:#0b1220; font-weight:700;
  }

  /* ---- 輪播 ---- */
  .carousel{
    position:relative; background:#000; border-radius:14px;
    overflow:hidden; user-select:none;
    touch-action: pan-y;
  }
  .track{display:flex; will-change:transform;}
  .slide{
    flex:0 0 100%; height:min(75vh, 800px);
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  .slide img{
    max-width:100%; max-height:100%;
    object-fit:contain; display:block;
    pointer-events:none; -webkit-user-drag:none;
  }
  .nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:46px; height:46px; border-radius:50%;
    border:0; background:rgba(0,0,0,.5); color:#fff;
    font-size:26px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:inherit; padding:0 0 4px 0;
    z-index:2; opacity:.85;
    transition:background .15s, opacity .15s;
  }
  .nav:hover{background:rgba(0,0,0,.85); opacity:1;}
  .nav:disabled{opacity:0; pointer-events:none;}
  .nav.prev{left:12px;}
  .nav.next{right:12px;}

  .counter{
    position:absolute; right:14px; bottom:12px;
    background:rgba(0,0,0,.62); color:#fff;
    font-size:.78rem; padding:3px 10px;
    border-radius:999px; letter-spacing:.04em;
    z-index:2; pointer-events:none;
    font-variant-numeric:tabular-nums;
  }

  .caption{
    margin-top:16px; padding:16px 20px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; font-size:1rem; line-height:1.7;
    color:#d7dce3; white-space:pre-wrap; word-break:break-word;
    min-height:62px;
  }
  .caption .num{
    display:inline-block; font-size:.75rem;
    background:#2a3140; color:#9aa3af;
    padding:2px 8px; border-radius:999px;
    margin-right:8px; font-variant-numeric:tabular-nums;
    vertical-align:middle;
  }
  .caption.empty{color:#6b7480; font-style:italic;}

  /* ---- 燈箱 ---- */
  #lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,.93);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px; cursor:zoom-out;
  }
  #lightbox[hidden]{display:none;}
  #lightbox img{max-width:100%; max-height:78vh; object-fit:contain; border-radius:8px;}
  #lightbox p{margin:0; color:#dfe3e8; text-align:center; max-width:820px; line-height:1.7;}
  #lightbox p[hidden]{display:none;}

  @media (max-width:600px){
    header{padding:12px 16px;}
    main{padding:16px;}
    .slide{height:60vh;}
    .nav{width:40px; height:40px; font-size:22px;}
    .nav.prev{left:8px;}
    .nav.next{right:8px;}
    .caption{font-size:.9rem; padding:12px 14px;}
    .thumb{font-size:.78rem; padding:5px 11px;}
  }
</style>
</head>
<body>

<header>
  <button id="back" class="btn" hidden>← 回目錄</button>
  <h1 id="title">台電受訓</h1>
</header>

<main id="view"></main>

<div id="lightbox" hidden>
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     設定區
     ========================================================= */
  const MANUAL_DIRS = [
    // 'test1',
  ];
  const DIRS_FILE = './dirs.txt';
  const IMG_EXT   = 'jpg';

  const MAX_SCAN   = 1000;
  const SCAN_BATCH = 16;
  const LOAD_BATCH = 16;
  const MISS_LIMIT = 6;

  /* =========================================================
     小工具
     ========================================================= */
  const $ = s => document.querySelector(s);
  const view     = $('#view');
  const titleEl  = $('#title');
  const backBtn  = $('#back');
  const lightbox = $('#lightbox');
  const lbImg    = $('#lbImg');
  const lbCap    = $('#lbCap');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const pad3   = n => String(n).padStart(3, '0');
  const imgURL = (dir, num) => `${dir}/${num}.${IMG_EXT}`;

  let pageAbort = null;

  /* =========================================================
     1. 找出所有子目錄
     ========================================================= */
  async function discoverDirs() {
    const found = new Set(MANUAL_DIRS);

    const listText = await fetchTextSmart(DIRS_FILE);
    if (listText) {
      listText.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
        const s = line.trim();
        if (!s || s.startsWith('#')) return;
        const name = s.replace(/\/+$/, '');
        if (name && !name.includes('/') && !name.startsWith('.')) found.add(name);
      });
    }

    try {
      const res = await fetch('./', { cache: 'no-store' });
      if (res.ok) {
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        if (!doc.querySelector('meta[name="app"]')) {
          const base = new URL('./', location.href);
          doc.querySelectorAll('a[href]').forEach(a => {
            let u;
            try { u = new URL(a.getAttribute('href'), base); } catch (_) { return; }
            if (u.origin !== base.origin) return;
            if (!u.pathname.startsWith(base.pathname)) return;
            if (!u.pathname.endsWith('/')) return;
            let rel;
            try { rel = decodeURIComponent(u.pathname.slice(base.pathname.length)); }
            catch (_) { return; }
            if (!rel.endsWith('/')) return;
            const name = rel.slice(0, -1);
            if (!name || name.includes('/') || name.startsWith('.')) return;
            found.add(name);
          });
        }
      }
    } catch (_) {}

    return [...found].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  }

  /* =========================================================
     2. 讀文字檔（UTF-8 / Big5 / GBK / BOM）
     ========================================================= */
  async function fetchTextSmart(url) {
    let res;
    try { res = await fetch(url, { cache: 'no-store' }); }
    catch (_) { return null; }
    if (!res.ok) return null;

    const buf = await res.arrayBuffer();
    if (!buf.byteLength) return '';

    const b = new Uint8Array(buf);
    if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF)
      return new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/, '');
    if (b[0] === 0xFF && b[1] === 0xFE) {
      try { return new TextDecoder('utf-16le').decode(buf).replace(/^\uFEFF/, ''); } catch (_) {}
    }
    if (b[0] === 0xFE && b[1] === 0xFF) {
      try { return new TextDecoder('utf-16be').decode(buf).replace(/^\uFEFF/, ''); } catch (_) {}
    }

    let text = new TextDecoder('utf-8').decode(buf);
    if (!text.includes('\uFFFD')) return text.replace(/^\uFEFF/, '');

    for (const enc of ['big5', 'big5-hkscs', 'ms950', 'gbk', 'gb18030']) {
      try {
        const t = new TextDecoder(enc).decode(buf);
        if (t && !t.includes('\uFFFD')) return t.replace(/^\uFEFF/, '');
      } catch (_) {}
    }
    return text;
  }

  /* =========================================================
     3. 解析 content.txt
     ========================================================= */
  function parseContent(text) {
    const map = new Map();
    text.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
      const s = line.trim();
      if (!s) return;
      const m = s.match(/^(\d+)(?:\s+([\s\S]*))?$/);
      if (!m) return;
      map.set(pad3(m[1]), (m[2] || '').trim());
    });
    return map;
  }

  /* =========================================================
     4. 圖片載入
     ========================================================= */
  function loadImage(url) {
    return new Promise(resolve => {
      const img = new Image();
      img.decoding = 'async';
      img.onload  = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  async function loadList(dir, nums) {
    const out = [];
    for (let i = 0; i < nums.length; i += LOAD_BATCH) {
      const batch = nums.slice(i, i + LOAD_BATCH);
      const res = await Promise.all(batch.map(n => loadImage(imgURL(dir, n))));
      for (let k = 0; k < res.length; k++) {
        if (res[k]) out.push({ num: batch[k], img: res[k] });
      }
    }
    return out;
  }

  async function scanItems(dir) {
    const out = [];
    let misses = 0;
    for (let i = 0; i < MAX_SCAN && misses < MISS_LIMIT; i += SCAN_BATCH) {
      const batch = [];
      for (let k = 0; k < SCAN_BATCH && i + k < MAX_SCAN; k++) batch.push(pad3(i + k));
      const res = await Promise.all(batch.map(n => loadImage(imgURL(dir, n))));
      for (let k = 0; k < res.length; k++) {
        if (res[k]) { out.push({ num: batch[k], img: res[k] }); misses = 0; }
        else misses++;
      }
    }
    return out;
  }

  /* =========================================================
     5. 燈箱
     ========================================================= */
  function openLightbox(item) {
    lbImg.src = item.img.src;
    lbImg.alt = item.cap || item.num;
    lbCap.textContent = item.cap || '';
    lbCap.hidden = !item.cap;
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.hidden = true;
    lbImg.src = '';
    document.body.style.overflow = '';
  }
  lightbox.addEventListener('click', closeLightbox);

  /* =========================================================
     6. 目錄列表
     ========================================================= */
  async function renderIndex() {
    if (pageAbort) { pageAbort.abort(); pageAbort = null; }
    backBtn.hidden = true;
    titleEl.textContent = '台電受訓';
    document.title = '台電';
    view.innerHTML = '';
    view.appendChild(el('p', 'hint', '讀取目錄中…'));

    const dirs = await discoverDirs();
    view.innerHTML = '';

    if (!dirs.length) {
      const p = el('p', 'hint');
      p.appendChild(document.createTextNode('找不到任何子目錄。'));
      p.appendChild(document.createElement('br'));
      p.appendChild(document.createTextNode(
        '請在根目錄建立 dirs.txt（一行一個目錄名稱），或在 index.html 的 MANUAL_DIRS 陣列中手動填入。'
      ));
      view.appendChild(p);
      return;
    }

    const ul = el('ul', 'dir-list');
    dirs.forEach(d => {
      const li = el('li');
      const a = el('a', 'dir-link');
      a.href = '#/' + encodeURIComponent(d);
      a.appendChild(el('span', 'dir-name', d));
      a.appendChild(el('span', 'dir-arrow', '›'));
      li.appendChild(a);
      ul.appendChild(li);
    });
    view.appendChild(ul);
  }

  /* =========================================================
     7. 相簿內容（輪播 + 主檔名導航）
     ========================================================= */
  async function renderGallery(dir) {
    if (pageAbort) pageAbort.abort();
    pageAbort = new AbortController();
    const signal = pageAbort.signal;

    backBtn.hidden = false;
    titleEl.textContent = dir;
    document.title = dir + ' — 相簿';
    view.innerHTML = '';
    view.appendChild(el('p', 'hint', '載入中…'));

    /* 讀 content.txt */
    const txt = await fetchTextSmart(dir + '/content.txt');
    const map = txt ? parseContent(txt) : null;

    let items, hasList = false;
    if (map && map.size) {
      hasList = true;
      const nums = [...map.keys()].sort((a, b) =>
        a.localeCompare(b, undefined, { numeric: true })
      );
      items = await loadList(dir, nums);
      items.forEach(it => { it.cap = map.get(it.num) || ''; });
    } else {
      items = await scanItems(dir);
      items.forEach(it => { it.cap = ''; });
    }

    if (!items.length) {
      view.innerHTML = '';
      view.appendChild(el('p', 'hint',
        hasList ? '清單中的編號都找不到對應圖片。' : '這個目錄裡找不到圖片。'));
      return;
    }

    view.innerHTML = '';

    /* ---- 主檔名導航列（上方） ---- */
    const thumbs = el('div', 'thumbs');
    const thumbBtns = items.map((it, i) => {
      const b = el('button', 'thumb', it.num);
      b.type = 'button';
      b.title = it.cap ? (it.num + ' — ' + it.cap) : it.num;
      b.setAttribute('aria-label', '跳到 ' + it.num);
      b.addEventListener('click', () => goTo(i));
      thumbs.appendChild(b);
      return b;
    });

    /* ---- 輪播本體 ---- */
    const carousel = el('div', 'carousel');
    const track    = el('div', 'track');

    items.forEach(it => {
      const slide = el('div', 'slide');
      slide.appendChild(it.img);
      track.appendChild(slide);
    });
    carousel.appendChild(track);

    const prevBtn = el('button', 'nav prev');
    prevBtn.type = 'button';
    prevBtn.setAttribute('aria-label', '上一張');
    prevBtn.textContent = '‹';

    const nextBtn = el('button', 'nav next');
    nextBtn.type = 'button';
    nextBtn.setAttribute('aria-label', '下一張');
    nextBtn.textContent = '›';

    const counter = el('div', 'counter');

    carousel.appendChild(prevBtn);
    carousel.appendChild(nextBtn);
    carousel.appendChild(counter);

    const capBox = el('div', 'caption');

    view.appendChild(thumbs);
    view.appendChild(carousel);
    view.appendChild(capBox);

    /* ---- 輪播狀態 ---- */
    let idx = 0;
    const total = items.length;
    let activeThumb = -1;

    function goTo(i, animate) {
      if (animate === undefined) animate = true;
      idx = Math.max(0, Math.min(total - 1, i));

      track.style.transition = animate
        ? 'transform .35s cubic-bezier(.22,.61,.36,1)'
        : 'none';
      track.style.transform = `translateX(${-idx * 100}%)`;

      counter.textContent = (idx + 1) + ' / ' + total;
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx >= total - 1;

      /* 更新導航列高亮 + 自動捲到可視範圍 */
      if (activeThumb !== idx) {
        if (thumbBtns[activeThumb]) thumbBtns[activeThumb].classList.remove('active');
        const t = thumbBtns[idx];
        if (t) {
          t.classList.add('active');
          /* 只在需要時捲動，避免每次點擊都跳 */
          try {
            t.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
          } catch (_) {
            t.scrollIntoView(false);
          }
        }
        activeThumb = idx;
      }

      /* 說明文字 */
      const it = items[idx];
      capBox.innerHTML = '';
      capBox.appendChild(el('span', 'num', it.num));
      if (it.cap) {
        capBox.classList.remove('empty');
        capBox.appendChild(document.createTextNode(it.cap));
      } else {
        capBox.classList.add('empty');
        capBox.appendChild(document.createTextNode('（無說明）'));
      }
    }

    prevBtn.addEventListener('click', () => goTo(idx - 1));
    nextBtn.addEventListener('click', () => goTo(idx + 1));

    /* ---- 觸控 / 滑鼠拖曳 ---- */
    let down = false, dragging = false;
    let startX = 0, startY = 0;
    let activePointer = null;

    function onDown(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      down = true;
      dragging = false;
      activePointer = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      track.style.transition = 'none';
    }

    function onMove(e) {
      if (!down || e.pointerId !== activePointer) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (!dragging) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        if (Math.abs(dy) > Math.abs(dx)) {
          down = false;
          activePointer = null;
          goTo(idx);
          return;
        }
        dragging = true;
      }

      if (e.cancelable) e.preventDefault();

      const w = carousel.offsetWidth || 1;
      const pct = (-idx * 100) + (dx / w) * 100;
      track.style.transform = `translateX(${pct}%)`;
    }

    function onUp(e) {
      if (!down) return;
      if (activePointer !== null && e.pointerId !== activePointer) return;

      const wasDragging = dragging;
      const dx = e.clientX - startX;
      down = false;
      dragging = false;
      activePointer = null;

      if (wasDragging) {
        const threshold = Math.max(50, carousel.offsetWidth * 0.15);
        if (dx < -threshold)     goTo(idx + 1);
        else if (dx > threshold) goTo(idx - 1);
        else                     goTo(idx);
      } else {
        openLightbox(items[idx]);
      }
    }

    track.addEventListener('pointerdown', onDown, { signal });
    document.addEventListener('pointermove', onMove, { passive: false, signal });
    document.addEventListener('pointerup', onUp, { signal });
    document.addEventListener('pointercancel', onUp, { signal });

    /* ---- 鍵盤 ---- */
    document.addEventListener('keydown', e => {
      if (!lightbox.hidden) {
        if (e.key === 'Escape') closeLightbox();
        return;
      }
      if (e.key === 'ArrowLeft')  { goTo(idx - 1); e.preventDefault(); }
      if (e.key === 'ArrowRight') { goTo(idx + 1); e.preventDefault(); }
    }, { signal });

    /* ---- 初次定位 ---- */
    goTo(0, false);
  }

  /* =========================================================
     8. 路由
     ========================================================= */
  function currentDir() {
    const h = location.hash.replace(/^#\/?/, '');
    if (!h) return null;
    try { return decodeURIComponent(h); } catch (_) { return h; }
  }

  async function render() {
    window.scrollTo(0, 0);
    const dir = currentDir();
    if (dir) await renderGallery(dir);
    else await renderIndex();
  }

  backBtn.addEventListener('click', () => { location.hash = '#/'; });
  window.addEventListener('hashchange', render);

  render();
})();
</script>
</body>
</html>
