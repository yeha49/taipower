<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 這個 meta 用來讓程式認出「這是自己的頁面」，避免解析到自己 -->
<meta name="app" content="gallery-index">
<title>相簿</title>
<style>
  :root{
    --bg:#0e1013; --panel:#171a20; --fg:#e9ecf1; --muted:#9aa3af;
    --line:#252a33; --accent:#5aa9ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--fg); min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:14px;
    padding:14px 24px;
    background:rgba(14,16,19,.85);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  h1{font-size:1.15rem; margin:0; font-weight:600; letter-spacing:.02em; word-break:break-all;}
  .btn{
    background:#222833; color:var(--fg); border:1px solid var(--line);
    padding:7px 14px; border-radius:999px; font-size:.9rem; cursor:pointer;
    font-family:inherit; transition:background .15s; white-space:nowrap;
  }
  .btn:hover{background:#2c3442;}

  main{padding:24px; max-width:1400px; margin:0 auto;}
  .hint{color:var(--muted); text-align:center; padding:48px 0; line-height:1.8;}

  /* ---- 目錄列表 ---- */
  .dir-list{
    list-style:none; padding:0; margin:0; display:grid; gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  }
  .dir-link{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:18px 20px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; color:var(--fg); text-decoration:none;
    transition:transform .15s, border-color .15s, background .15s;
  }
  .dir-link:hover{transform:translateY(-2px); border-color:var(--accent); background:#1c212a;}
  .dir-name{font-weight:600; word-break:break-all;}
  .dir-arrow{color:var(--muted); font-size:1.3rem; line-height:1;}

  /* ---- 圖片格 ---- */
  .grid{
    display:grid; gap:20px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  }
  .card{
    margin:0; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; overflow:hidden; position:relative;
    display:flex; flex-direction:column;
  }
  .card img{
    width:100%; aspect-ratio:4/3; object-fit:cover; display:block;
    cursor:zoom-in; background:#0b0d10;
  }
  .badge{
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,.62); color:#fff; font-size:.72rem;
    padding:2px 9px; border-radius:999px; letter-spacing:.06em;
    pointer-events:none;
  }
  figcaption{
    padding:12px 14px; font-size:.92rem; line-height:1.55;
    color:#d7dce3; flex:1; white-space:pre-wrap; word-break:break-word;
  }

  /* ---- 燈箱 ---- */
  #lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,.93);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px; cursor:zoom-out;
  }
  #lightbox[hidden]{display:none;}
  #lightbox img{max-width:100%; max-height:78vh; object-fit:contain; border-radius:8px;}
  #lightbox p{margin:0; color:#dfe3e8; text-align:center; max-width:820px; line-height:1.7;}

  @media (max-width:600px){
    header{padding:12px 16px;}
    main{padding:16px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
    .card img{aspect-ratio:1/1;}
    figcaption{font-size:.82rem; padding:9px 11px;}
  }
</style>
</head>
<body>

<header>
  <button id="back" class="btn" hidden>← 回目錄</button>
  <h1 id="title">台電受訓</h1>
</header>

<main id="view"></main>

<div id="lightbox" hidden>
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     設定區
     ========================================================= */

  // 除了 dirs.txt 之外，也可以直接在這裡寫死一些目錄名稱
  // （dirs.txt 讀到的會一起合併）
  const MANUAL_DIRS = [
    // 'test1',
    // 'another_dir',
  ];

  // dirs.txt 的位置（相對於 index.html）
  const DIRS_FILE = './dirs.txt';

  // 圖片可能的副檔名（會依序嘗試）
  const IMG_EXTS = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp',
                    'JPG', 'JPEG', 'PNG', 'WEBP'];

  const MAX_SCAN   = 1000; // 沒有 content.txt 時，最多掃描到 999
  const SCAN_BATCH = 12;   // 掃描時每批同時探測幾個編號

  /* =========================================================
     小工具
     ========================================================= */
  const $ = s => document.querySelector(s);
  const view    = $('#view');
  const titleEl = $('#title');
  const backBtn = $('#back');
  const lightbox = $('#lightbox');
  const lbImg = $('#lbImg');
  const lbCap = $('#lbCap');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  /* =========================================================
     1. 找出所有子目錄
        (a) 讀 dirs.txt       → GitHub Pages 主要靠這個
        (b) 讀目錄索引         → 本機 / 有 autoindex 的伺服器
        (c) MANUAL_DIRS 手動   → 備用
     ========================================================= */
  async function discoverDirs() {
    const found = new Set(MANUAL_DIRS);

    // (a) 讀 dirs.txt
    const listText = await fetchTextSmart(DIRS_FILE);
    if (listText) {
      listText.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
        const s = line.trim();
        if (!s || s.startsWith('#')) return;
        const name = s.replace(/\/+$/, '');         // 允許寫 "taipower_edu/"
        if (name && !name.includes('/') && !name.startsWith('.')) {
          found.add(name);
        }
      });
    }

    // (b) 讀目錄索引（若伺服器有開啟 autoindex）
    try {
      const res = await fetch('./', { cache: 'no-store' });
      if (res.ok) {
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');

        // 若伺服器把 index.html 原封不動丟回來，就不解析（避免解析到自己）
        if (!doc.querySelector('meta[name="app"]')) {
          const base = new URL('./', location.href);

          doc.querySelectorAll('a[href]').forEach(a => {
            let u;
            try { u = new URL(a.getAttribute('href'), base); } catch (_) { return; }

            if (u.origin !== base.origin) return;
            if (!u.pathname.startsWith(base.pathname)) return;
            if (!u.pathname.endsWith('/')) return;

            let rel;
            try { rel = decodeURIComponent(u.pathname.slice(base.pathname.length)); }
            catch (_) { return; }

            if (!rel.endsWith('/')) return;
            const name = rel.slice(0, -1);
            if (!name || name.includes('/') || name.startsWith('.')) return;

            found.add(name);
          });
        }
      }
    } catch (_) { /* 跨網域 / file:// 會失敗，忽略 */ }

    return [...found].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  }

  /* =========================================================
     2. 讀文字檔（自動處理 UTF-8 / Big5 / GBK / BOM）
     ========================================================= */
  async function fetchTextSmart(url) {
    let res;
    try { res = await fetch(url, { cache: 'no-store' }); }
    catch (_) { return null; }
    if (!res.ok) return null;

    const buf = await res.arrayBuffer();
    if (!buf.byteLength) return '';

    const b = new Uint8Array(buf);

    // BOM 判斷
    if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF)
      return new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/, '');
    if (b[0] === 0xFF && b[1] === 0xFE) {
      try { return new TextDecoder('utf-16le').decode(buf).replace(/^\uFEFF/, ''); } catch (_) {}
    }
    if (b[0] === 0xFE && b[1] === 0xFF) {
      try { return new TextDecoder('utf-16be').decode(buf).replace(/^\uFEFF/, ''); } catch (_) {}
    }

    // 先試 UTF-8
    let text = new TextDecoder('utf-8').decode(buf);
    if (!text.includes('\uFFFD')) return text.replace(/^\uFEFF/, '');

    // 有亂碼 → 換 Big5 / GBK 試試
    for (const enc of ['big5', 'big5-hkscs', 'ms950', 'gbk', 'gb18030']) {
      try {
        const t = new TextDecoder(enc).decode(buf);
        if (t && !t.includes('\uFFFD')) return t.replace(/^\uFEFF/, '');
      } catch (_) {}
    }
    return text;
  }

  /* =========================================================
     3. 解析 content.txt → Map { '000' => '說明文字' }
     ========================================================= */
  function parseContent(text) {
    const map = new Map();
    text.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
      const s = line.trim();
      if (!s) return;

      // 格式：編號 + 空白 + 說明（說明可省略）
      const m = s.match(/^(\d+)(?:\s+([\s\S]*))?$/);
      if (!m) return;

      const num = m[1].padStart(3, '0');
      map.set(num, (m[2] || '').trim());
    });
    return map;
  }

  /* =========================================================
     4. 找出某編號的圖片實際檔名（依序試各種副檔名）
     ========================================================= */
  const extCache = new Map(); // dir -> 已確認可用的副檔名

  function probeImage(dir, num) {
    const cached = extCache.get(dir);
    const exts = cached
      ? [cached, ...IMG_EXTS.filter(e => e !== cached)]
      : IMG_EXTS.slice();

    return new Promise(resolve => {
      const queue = exts.slice();
      const tryNext = () => {
        const ext = queue.shift();
        if (!ext) { resolve(null); return; }

        const img = new Image();
        img.onload  = () => { extCache.set(dir, ext); resolve(img.src); };
        img.onerror = tryNext;
        img.src = `${dir}/${num}.${ext}`;
      };
      tryNext();
    });
  }

  /* 沒有任何清單時，從 000 開始連續掃描 */
  async function scanNumbers(dir) {
    const nums = [];
    let i = 0, misses = 0;

    while (i < MAX_SCAN && misses < 6) {
      const batch = [];
      for (let k = 0; k < SCAN_BATCH && i < MAX_SCAN; k++, i++) {
        batch.push(String(i).padStart(3, '0'));
      }
      const results = await Promise.all(batch.map(n => probeImage(dir, n)));
      results.forEach((src, idx) => {
        if (src) { nums.push(batch[idx]); misses = 0; }
        else { misses++; }
      });
    }
    return nums;
  }

  /* =========================================================
     5. 燈箱
     ========================================================= */
  function openLightbox(item) {
    lbImg.src = item.src;
    lbImg.alt = item.cap || item.num;
    lbCap.textContent = (item.cap ? item.cap : '');
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.hidden = true;
    lbImg.src = '';
    document.body.style.overflow = '';
  }
  lightbox.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !lightbox.hidden) closeLightbox();
  });

  /* =========================================================
     6. 畫面：目錄列表
     ========================================================= */
  async function renderIndex() {
    backBtn.hidden = true;
    titleEl.textContent = '台電受訓';
    document.title = '相簿';
    view.innerHTML = '';
    view.appendChild(el('p', 'hint', '讀取目錄中…'));

    const dirs = await discoverDirs();
    view.innerHTML = '';

    if (!dirs.length) {
      const p = el('p', 'hint');
      p.appendChild(document.createTextNode('找不到任何子目錄。'));
      p.appendChild(document.createElement('br'));
      p.appendChild(document.createTextNode(
        '請在根目錄建立 dirs.txt（一行一個目錄名稱），或在 index.html 的 MANUAL_DIRS 陣列中手動填入。'
      ));
      view.appendChild(p);
      return;
    }

    const ul = el('ul', 'dir-list');
    dirs.forEach(d => {
      const li = el('li');
      const a = el('a', 'dir-link');
      a.href = '#/' + encodeURIComponent(d);
      a.appendChild(el('span', 'dir-name', d));
      a.appendChild(el('span', 'dir-arrow', '›'));
      li.appendChild(a);
      ul.appendChild(li);
    });
    view.appendChild(ul);
  }

  /* =========================================================
     7. 畫面：相簿內容
     ========================================================= */
  async function renderGallery(dir) {
    backBtn.hidden = false;
    titleEl.textContent = dir;
    document.title = dir + ' — 相簿';
    view.innerHTML = '';
    view.appendChild(el('p', 'hint', '載入中…'));

    // --- 讀 content.txt ---
    let map = null;
    const txt = await fetchTextSmart(dir + '/content.txt');
    if (txt) map = parseContent(txt);

    // --- 決定要顯示哪些編號 ---
    let nums;
    if (map && map.size) {
      nums = [...map.keys()].sort((a, b) =>
        a.localeCompare(b, undefined, { numeric: true })
      );
    } else {
      nums = await scanNumbers(dir);
    }

    if (!nums.length) {
      view.innerHTML = '';
      view.appendChild(el('p', 'hint', '這個目錄裡找不到圖片。'));
      return;
    }

    // --- 探測每張圖片 ---
    const items = (await Promise.all(nums.map(async n => ({
      num: n,
      src: await probeImage(dir, n),
      cap: map ? (map.get(n) || '') : ''
    })))).filter(it => it.src);

    if (!items.length) {
      view.innerHTML = '';
      view.appendChild(el('p', 'hint', '清單中的編號都找不到對應圖片。'));
      return;
    }

    // --- 渲染 ---
    const grid = el('div', 'grid');
    items.forEach(it => {
      const fig = el('figure', 'card');

      const img = el('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.src = it.src;
      img.alt = it.cap || it.num;
      img.addEventListener('click', () => openLightbox(it));
      fig.appendChild(img);

      fig.appendChild(el('span', 'badge', it.num));

      const cap = el('figcaption');
      cap.textContent = it.cap || '（無說明）';
      fig.appendChild(cap);

      grid.appendChild(fig);
    });

    view.innerHTML = '';
    view.appendChild(grid);
  }

  /* =========================================================
     8. 路由（用 #/目錄名）
     ========================================================= */
  function currentDir() {
    const h = location.hash.replace(/^#\/?/, '');
    if (!h) return null;
    try { return decodeURIComponent(h); } catch (_) { return h; }
  }

  async function render() {
    window.scrollTo(0, 0);
    const dir = currentDir();
    if (dir) await renderGallery(dir);
    else await renderIndex();
  }

  backBtn.addEventListener('click', () => { location.hash = '#/'; });
  window.addEventListener('hashchange', render);

  render();
})();
</script>
</body>
</html>
